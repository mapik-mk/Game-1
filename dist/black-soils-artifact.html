<title>Чёрные Почвы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Pixelify+Sans:wght@400;600;700&family=Rubik+Wet+Paint&display=swap">
<style>
/* Layout: полноэкранный пиксельный мир; HUD прижат к углам; меню — пергамент в деревянной раме (Stardew),
   при потере рассудка всё выцветает в чернила и кровь (Black Souls). */
:root{
  --ink:#0e0b0d; --ink-2:#1d1619; --ink-3:#2c2226;
  --paper:#f3e4c0; --paper-2:#e3cb98; --paper-3:#c9ab6e;
  --wood:#7b4a25; --wood-d:#3f2311; --wood-l:#b07a42;
  --blood:#c2142e; --blood-d:#6a0816; --moss:#79ad44; --gold:#f7c948; --violet:#9a63e0; --sky:#6fb6e6;
  --text:#2b1a0e; --text-2:#6b4c2d; --text-l:#f7ecd4;
  --f-ui:'Pixelify Sans','Courier New',monospace;
  --f-title:'Rubik Wet Paint','Pixelify Sans',Impact,serif;
  --f-hand:'Neucha','Comic Sans MS','Segoe Print',cursive;
  --gs:0;
  color-scheme:dark;
}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text-l);overflow:hidden;overscroll-behavior:none;}
body{font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
#app{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);overflow:hidden;background:var(--ink);}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
#vignette{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(120,0,20,.55) 100%);}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;}
#fade.on{opacity:1;pointer-events:all;}
button{font-family:var(--f-ui);cursor:pointer;}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;}
#hud-left{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;padding:6px 8px;border-radius:6px;
  background:rgba(20,12,10,.72);border:2px solid var(--wood-d);box-shadow:inset 0 0 0 1px var(--wood);}
.bar{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--paper);}
.bar b{width:28px;}
.bar span{display:block;width:96px;height:9px;background:#140c0c;border:1px solid #000;position:relative;overflow:hidden;}
.bar i{position:absolute;left:0;top:0;bottom:0;width:50%;transition:width .2s;}
#bar-hp i{background:linear-gradient(#ff5a5a,#b8152a);}
#bar-en i{background:linear-gradient(#e8f26a,#6fa52a);}
#bar-sn i{background:linear-gradient(#c79bff,#5b2aa6);}
#bar-sn.low i{background:linear-gradient(#ff2a4a,#5a0010);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.5}}
#souls{font-size:11px;color:#bfe6ff;letter-spacing:.04em;}
#hud-right{position:absolute;right:8px;top:8px;display:flex;gap:6px;align-items:flex-start;}
#clock{min-width:118px;padding:6px 10px;border-radius:6px;text-align:right;background:var(--paper);color:var(--text);
  border:3px solid var(--wood);box-shadow:0 0 0 2px var(--wood-d),2px 3px 0 3px rgba(0,0,0,.35);filter:grayscale(var(--gs));}
#c-date{font-size:12px;font-weight:700;}
#c-time{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;}
#c-gold{font-size:13px;font-weight:700;color:#8a5a00;font-variant-numeric:tabular-nums;}
#b-menu{pointer-events:auto;width:40px;height:40px;font-size:24px;line-height:1;border-radius:6px;background:var(--wood);color:var(--paper);
  border:2px solid var(--wood-d);box-shadow:inset 0 0 0 2px var(--wood-l);}
#locname{position:absolute;left:50%;top:104px;transform:translateX(-50%);font-size:15px;color:var(--paper);text-shadow:0 2px 0 #000,0 0 6px #000;
  opacity:0;transition:opacity .6s;white-space:nowrap;letter-spacing:.08em;}
#locname.on{opacity:1;}
#notes{position:absolute;left:8px;top:128px;display:flex;flex-direction:column;gap:4px;max-width:min(70%,420px);pointer-events:none;}
.note{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px;border-radius:4px;background:rgba(20,12,10,.85);border:1px solid var(--wood);
  color:var(--paper);animation:noteIn .25s ease-out;}
.note img{width:20px;height:20px;image-rendering:pixelated;}
.note.bad{border-color:var(--blood);color:#ffb3bd;}
.note.good{border-color:var(--moss);color:#d9f7b8;}
@keyframes noteIn{from{transform:translateX(-20px);opacity:0}}
#toolbar{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:6px;pointer-events:auto;
  background:var(--wood);border:2px solid var(--wood-d);box-shadow:inset 0 0 0 2px var(--wood-l);}
.slot{position:relative;width:var(--slot,40px);height:var(--slot,40px);background:var(--paper-2);border:2px solid var(--paper-3);border-radius:3px;
  display:flex;align-items:center;justify-content:center;padding:0;filter:grayscale(var(--gs));}
.slot img{width:80%;height:80%;image-rendering:pixelated;pointer-events:none;}
.slot.sel{border-color:var(--blood);box-shadow:0 0 0 2px var(--blood),inset 0 0 0 1px #fff;}
.slot .n{position:absolute;right:1px;bottom:-1px;font-size:11px;font-weight:700;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;}
.slot .q{position:absolute;left:1px;bottom:1px;width:7px;height:7px;}
.slot .q.q1{background:#c8d4e0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.slot .q.q2{background:#ffcc33;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);}
.slot .bar2{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:#222;}
.slot .bar2 i{display:block;height:100%;background:#4aa0ff;}

/* ---------- Touch ---------- */
#touch{position:absolute;inset:0;pointer-events:none;}
#joyzone{position:absolute;left:0;bottom:calc(var(--tb-h,56px) + 4px);width:48%;height:46%;pointer-events:auto;}
#joybase{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(255,240,210,.10);border:2px solid rgba(255,240,210,.35);
  left:90px;top:calc(100% - 90px);transition:opacity .2s;opacity:.55;}
#joyknob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,240,210,.45);border:2px solid rgba(60,30,10,.6);}
#tbtns{position:absolute;right:10px;bottom:calc(var(--tb-h,56px) + 14px);width:170px;height:150px;pointer-events:none;}
.tb{pointer-events:auto;position:absolute;border-radius:50%;border:3px solid var(--wood-d);background:rgba(176,122,66,.82);color:var(--paper);
  box-shadow:inset 0 0 0 2px rgba(255,230,180,.45),0 3px 0 rgba(0,0,0,.4);font-size:26px;display:flex;align-items:center;justify-content:center;padding:0;}
.tb:active,.tb.on{transform:translateY(2px);background:rgba(194,20,46,.85);}
#b-use{width:78px;height:78px;right:0;bottom:0;}
#b-use img{width:44px;height:44px;image-rendering:pixelated;}
#b-act{width:60px;height:60px;right:88px;bottom:4px;}
#b-roll{width:48px;height:48px;right:18px;bottom:90px;font-size:22px;}

/* ---------- Dialog ---------- */
#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--tb-h,56px) + 8px);width:min(720px,calc(100% - 16px));
  display:flex;gap:10px;padding:10px;border-radius:6px;background:var(--paper);color:var(--text);
  border:4px solid var(--wood);box-shadow:0 0 0 2px var(--wood-d),0 6px 0 2px rgba(0,0,0,.45);filter:grayscale(var(--gs));z-index:5;}
#dlg.narr{background:#111;color:#eee;border-color:#444;box-shadow:0 0 0 2px #000;font-family:var(--f-hand);}
#dlg.narr #dlg-text{font-family:var(--f-hand);font-size:19px;}
#dlg.creepy{background:#e9e9e9;border-color:#222;}
#dlg-por{flex:0 0 auto;width:104px;height:104px;background:#cfa96a;border:3px solid var(--wood-d);border-radius:4px;overflow:hidden;align-self:flex-start;
  background-image:linear-gradient(#e9c98a,#b8894c);}
#dlg-por[hidden]{display:none!important}
#dlg-cv{width:100%;height:100%;image-rendering:pixelated;}
#dlg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
#dlg-name{align-self:flex-start;font-weight:700;font-size:14px;padding:2px 10px;border-radius:3px;background:var(--wood);color:var(--paper);letter-spacing:.04em;}
#dlg-name:empty{display:none}
#dlg-text{font-size:16px;line-height:1.4;min-height:3.6em;white-space:pre-wrap;overflow-wrap:anywhere;}
#dlg-choices{display:flex;flex-wrap:wrap;gap:6px;}
#dlg-choices button{flex:1 1 auto;min-width:72px;padding:8px 12px;font-size:15px;font-weight:700;border-radius:4px;border:2px solid var(--wood-d);
  background:var(--paper-2);color:var(--text);}
#dlg-choices button.kill{background:var(--blood-d);color:#ffd5da;border-color:#000;letter-spacing:.12em;}
#dlg-choices button:active{background:var(--gold);}
#dlg-next{position:absolute;right:12px;bottom:6px;color:var(--wood);font-size:14px;animation:bob .8s infinite;}
@keyframes bob{50%{transform:translateY(3px)}}

/* ---------- Panels (menus, shops) ---------- */
#panel{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(5,3,4,.55);padding:8px;box-sizing:border-box;}
.win{width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--text);border:4px solid var(--wood);
  border-radius:6px;box-shadow:0 0 0 2px var(--wood-d),0 8px 0 2px rgba(0,0,0,.5);filter:grayscale(var(--gs));overflow:hidden;box-sizing:border-box;}
.win-h{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--wood);color:var(--paper);}
.win-h h2{margin:0;font-size:16px;flex:1;letter-spacing:.06em;font-weight:700;}
.win-h .x{width:34px;height:34px;font-size:18px;border-radius:4px;border:2px solid var(--wood-d);background:var(--blood);color:#fff;}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px 6px 0;background:var(--paper-2);flex:0 0 auto;}
.tabs button{flex:0 0 auto;padding:7px 10px;font-size:13px;font-weight:700;border:2px solid var(--wood);border-bottom:none;border-radius:5px 5px 0 0;
  background:var(--paper-3);color:var(--text);}
.tabs button.on{background:var(--paper);}
.win-b{padding:10px;overflow:auto;flex:1;min-height:0;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--slot,40px),1fr));gap:3px;}
.grid .slot{width:auto;aspect-ratio:1;height:auto;max-width:100%;}
.info{margin-top:8px;padding:8px;border:2px solid var(--paper-3);border-radius:4px;background:#fbf2dc;min-height:64px;font-size:13px;line-height:1.35;}
.info h3{margin:0 0 4px;font-size:15px;}
.info .muted{color:var(--text-2);}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.btn{padding:8px 12px;font-size:14px;font-weight:700;border-radius:4px;border:2px solid var(--wood-d);background:var(--wood-l);color:#fff;text-shadow:1px 1px 0 var(--wood-d);}
.btn:disabled{opacity:.45;}
.btn.red{background:var(--blood);}
.btn.green{background:#4c8a2a;}
.list{display:flex;flex-direction:column;gap:4px;}
.li{display:flex;align-items:center;gap:8px;padding:6px;border:2px solid var(--paper-3);border-radius:4px;background:#fbf2dc;}
.li img{width:32px;height:32px;image-rendering:pixelated;flex:0 0 auto;}
.li .t{flex:1;min-width:0;font-size:13px;line-height:1.25;}
.li .t b{font-size:14px;}
.li .t small{display:block;color:var(--text-2);}
.li .p{font-weight:700;color:#8a5a00;white-space:nowrap;font-variant-numeric:tabular-nums;}
.li.dis{opacity:.5;}
.li.done{background:#e3f2cf;border-color:#8bb35a;}
.hearts{color:var(--blood);letter-spacing:1px;font-size:13px;}
.sk{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px;}
.sk b{width:110px;}
.sk .pips{display:flex;gap:2px;}
.sk .pips i{width:10px;height:12px;background:var(--paper-3);border:1px solid var(--wood);}
.sk .pips i.on{background:var(--moss);}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;}
.kv b{color:var(--text-2);font-weight:600;}
textarea.save{width:100%;box-sizing:border-box;height:90px;font-family:monospace;font-size:11px;background:#fff8e6;color:#222;border:2px solid var(--wood);}
.bundle{border:2px solid var(--paper-3);border-radius:4px;padding:6px;margin-bottom:6px;background:#fbf2dc;}
.bundle.done{background:#e3f2cf;border-color:#8bb35a;}
.bundle h4{margin:0 0 4px;font-size:14px;}
.bundle .req{display:flex;flex-wrap:wrap;gap:4px;}
.req .slot{width:36px;height:36px;}
.req .slot.have{border-color:#4c8a2a;}
.req .slot.got{background:#b9dc8f;}
.fishbox{display:flex;justify-content:center;}

/* ---------- Fullscreen screens ---------- */
#screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  background:var(--ink);color:var(--text-l);padding:16px;box-sizing:border-box;overflow:auto;}
.title-logo{font-family:var(--f-title);font-size:clamp(44px,13vw,96px);line-height:.9;color:#f3efe8;letter-spacing:.02em;
  text-shadow:3px 3px 0 var(--blood-d),0 0 24px rgba(194,20,46,.45);}
.title-logo em{display:block;font-style:normal;color:var(--blood);font-size:.52em;margin-top:6px;}
.title-sub{font-family:var(--f-hand);font-size:18px;color:#bba;max-width:34ch;}
.menu-col{display:flex;flex-direction:column;gap:8px;width:min(300px,100%);}
.menu-col .btn{font-size:17px;padding:11px;}
.died{font-family:var(--f-title);font-size:clamp(46px,14vw,110px);color:var(--blood);letter-spacing:.06em;text-shadow:0 0 30px rgba(194,20,46,.6);animation:died 3s ease-out;}
@keyframes died{from{opacity:0;transform:scale(1.15);letter-spacing:.3em}}
.ending-t{font-family:var(--f-title);font-size:clamp(30px,8vw,56px);color:#f3efe8;}
.ending-p{font-family:var(--f-hand);font-size:19px;line-height:1.45;max-width:38ch;color:#ddd;white-space:pre-wrap;}
.cc{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;text-align:left;width:min(420px,100%);}
.cc input{font-family:var(--f-ui);font-size:16px;padding:6px;border-radius:4px;border:2px solid var(--wood);background:var(--paper);color:var(--text);}
.cc .opts{display:flex;flex-wrap:wrap;gap:4px;}
.cc .opts button{padding:6px 8px;font-size:13px;border-radius:4px;border:2px solid var(--wood-d);background:var(--paper-2);color:var(--text);}
.cc .opts button.on{background:var(--blood);color:#fff;}
.sw{width:26px;height:26px;border-radius:50%;padding:0!important;}
#cc-preview{width:128px;height:128px;image-rendering:pixelated;background:#2a3a20;border:3px solid var(--wood);border-radius:6px;}
.summary{background:var(--paper);color:var(--text);border:4px solid var(--wood);border-radius:6px;padding:14px;width:min(420px,100%);box-sizing:border-box;}
.summary h2{margin:0 0 8px;}
.summary .tot{font-size:22px;font-weight:700;color:#8a5a00;margin-top:8px;}
.letter{background:#f6ecd2;color:#2a1c10;font-family:var(--f-hand);font-size:19px;line-height:1.45;padding:18px 20px;border-radius:2px;width:min(460px,100%);
  box-sizing:border-box;text-align:left;white-space:pre-wrap;box-shadow:0 10px 30px rgba(0,0,0,.6);background-image:repeating-linear-gradient(transparent 0 27px,rgba(120,80,40,.15) 27px 28px);}
.letter.cursed{background:#ddd;color:#111;filter:contrast(1.2);}
.letter .att{font-family:var(--f-ui);font-size:14px;margin-top:10px;color:#6b4c2d;}
.credits{font-family:var(--f-hand);font-size:18px;color:#ccc;line-height:1.6;}
.small-note{font-size:12px;color:#998;}

@media (max-width:520px){
  .bar span{width:70px;}
  #clock{min-width:96px;padding:4px 8px;}
  #c-time{font-size:17px;}
  #dlg-por{width:72px;height:72px;}
  #dlg-text{font-size:15px;}
  #hud-left{padding:4px 6px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}

</style>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="vignette"></div>
  <div id="hud" hidden>
    <div id="hud-left">
      <div class="bar" id="bar-hp"><b>HP</b><span><i></i></span></div>
      <div class="bar" id="bar-en"><b>ЭН</b><span><i></i></span></div>
      <div class="bar" id="bar-sn"><b>РАС</b><span><i></i></span></div>
      <div id="souls"></div>
    </div>
    <div id="hud-right">
      <div id="clock">
        <div id="c-date"></div>
        <div id="c-time"></div>
        <div id="c-gold"></div>
      </div>
      <button id="b-menu" aria-label="Меню">≡</button>
    </div>
    <div id="locname"></div>
    <div id="notes"></div>
    <div id="toolbar"></div>
  </div>
  <div id="touch" hidden>
    <div id="joyzone"><div id="joybase"><div id="joyknob"></div></div></div>
    <div id="tbtns">
      <button id="b-roll" class="tb small" aria-label="Кувырок">⟲</button>
      <button id="b-act" class="tb" aria-label="Взаимодействие">✋</button>
      <button id="b-use" class="tb big" aria-label="Использовать"><img id="b-use-ico" alt=""></button>
    </div>
  </div>
  <div id="dlg" hidden>
    <div id="dlg-por"><canvas id="dlg-cv" width="64" height="64"></canvas></div>
    <div id="dlg-body">
      <div id="dlg-name"></div>
      <div id="dlg-text"></div>
      <div id="dlg-choices"></div>
    </div>
    <div id="dlg-next">▼</div>
  </div>
  <div id="panel" hidden></div>
  <div id="screen" hidden></div>
  <div id="fade"></div>
</div>

<script>
// ===== 00_core.js =====
'use strict';
/* ============================================================
   ЧЁРНЫЕ ПОЧВЫ (BLACK SOILS) — ядро: утилиты, ввод, звук, хранилище
   ============================================================ */
const TS = 16;                 // размер тайла в пикселях
const $ = (s, r = document) => r.querySelector(s);
const U = {
  clamp: (v, a, b) => v < a ? a : v > b ? b : v,
  lerp: (a, b, t) => a + (b - a) * t,
  rnd: (a, b) => a + Math.random() * (b - a),
  ri: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: arr => arr[Math.floor(Math.random() * arr.length)],
  chance: p => Math.random() < p,
  dist: (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by),
  shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  hash(x, y, s = 0) { // детерминированный шум 0..1
    let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  },
  approach(v, t, d) { return v < t ? Math.min(v + d, t) : Math.max(v - d, t); },
  fmt(n) { return Math.floor(n).toLocaleString('ru-RU'); },
  plural(n, a, b, c) { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; },
  wchoice(list) { // [[weight, value], ...]
    let t = 0; for (const [w] of list) t += w;
    let r = Math.random() * t;
    for (const [w, v] of list) { if ((r -= w) <= 0) return v; }
    return list[list.length - 1][1];
  },
  sleep: ms => new Promise(r => setTimeout(r, ms)),
};
function RNG(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6D2B79F5) | 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

/* ---------- безопасное хранилище ---------- */
const Store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },

/* ---------- ввод: клавиатура + сенсор ---------- */
const Input = {
  down: {}, hit: {}, joy: { x: 0, y: 0, on: false }, touch: false, lastHitTime: {},
  keymap: {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'use', KeyJ: 'use', KeyC: 'use', KeyE: 'act', KeyK: 'act', Enter: 'act', KeyX: 'act', KeyF: 'act',
    ShiftLeft: 'roll', ShiftRight: 'roll', KeyL: 'roll', KeyI: 'menu', Tab: 'menu', Escape: 'esc', KeyQ: 'prev', KeyR: 'next',
    Digit1: 's0', Digit2: 's1', Digit3: 's2', Digit4: 's3', Digit5: 's4', Digit6: 's5', Digit7: 's6', Digit8: 's7', Digit9: 's8', Digit0: 's9', Minus: 's10', Equal: 's11',
  },
  press(a) { if (!this.down[a]) this.hit[a] = true; this.down[a] = true; },
  release(a) { this.down[a] = false; },
  endFrame() { this.hit = {}; },
  clear() { this.down = {}; this.hit = {}; this.joy.x = this.joy.y = 0; },
  axis() {
    let x = 0, y = 0;
    if (this.down.left) x -= 1; if (this.down.right) x += 1; if (this.down.up) y -= 1; if (this.down.down) y += 1;
    x += this.joy.x; y += this.joy.y;
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    return { x, y };
  },
  init() {
    addEventListener('keydown', e => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      const a = this.keymap[e.code]; if (!a) return;
      e.preventDefault(); this.press(a); AU.unlock();
    });
    addEventListener('keyup', e => { const a = this.keymap[e.code]; if (a) this.release(a); });
    addEventListener('blur', () => this.clear());
    this.touch = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
    // джойстик
    const zone = $('#joyzone'), base = $('#joybase'), knob = $('#joyknob');
    let jid = null, bx = 0, by = 0;
    const R = 46;
    const setKnob = (dx, dy) => { knob.style.transform = `translate(${dx}px,${dy}px)`; };
    const start = (id, cx, cy) => {
      jid = id; const r = zone.getBoundingClientRect(); bx = cx; by = cy;
      base.style.left = (cx - r.left) + 'px'; base.style.top = (cy - r.top) + 'px'; base.style.opacity = '1'; setKnob(0, 0); this.joy.on = true;
    };
    const move = (cx, cy) => {
      let dx = cx - bx, dy = cy - by; const l = Math.hypot(dx, dy);
      if (l > R) { dx = dx / l * R; dy = dy / l * R; }
      setKnob(dx, dy);
      const m = Math.hypot(dx, dy) / R;
      if (m < 0.18) { this.joy.x = this.joy.y = 0; } else { this.joy.x = dx / R; this.joy.y = dy / R; }
    };
    const end = () => { jid = null; this.joy.x = this.joy.y = 0; this.joy.on = false; setKnob(0, 0); base.style.opacity = '.55'; };
    zone.addEventListener('touchstart', e => { e.preventDefault(); AU.unlock(); const t = e.changedTouches[0]; if (jid === null) start(t.identifier, t.clientX, t.clientY); }, { passive: false });
    zone.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === jid) move(t.clientX, t.clientY); }, { passive: false });
    const tend = e => { for (const t of e.changedTouches) if (t.identifier === jid) end(); };
    zone.addEventListener('touchend', tend); zone.addEventListener('touchcancel', tend);
    // мышь для теста
    let md = false;
    zone.addEventListener('mousedown', e => { md = true; start('m', e.clientX, e.clientY); });
    addEventListener('mousemove', e => { if (md) move(e.clientX, e.clientY); });
    addEventListener('mouseup', () => { if (md) { md = false; end(); } });
    // кнопки
    const bind = (id, act) => {
      const b = $(id);
      const on = e => { e.preventDefault(); AU.unlock(); this.press(act); b.classList.add('on'); };
      const off = e => { e.preventDefault(); this.release(act); b.classList.remove('on'); };
      b.addEventListener('touchstart', on, { passive: false }); b.addEventListener('touchend', off, { passive: false }); b.addEventListener('touchcancel', off);
      b.addEventListener('mousedown', on); b.addEventListener('mouseup', off); b.addEventListener('mouseleave', e => { if (this.down[act]) off(e); });
    };
    bind('#b-use', 'use'); bind('#b-act', 'act'); bind('#b-roll', 'roll');
    $('#b-menu').addEventListener('click', () => { AU.unlock(); this.hit.menu = true; });
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
  },
};

const Music = {

    dungeon: { bpm: 84, root: 45, scale: [0, 1, 3, 5, 7, 8, 10], seed: 9, inst: 'saw', bass: true, len: 32, density: .35, drone: true },
    boss: { bpm: 150, root: 45, scale: [0, 1, 3, 6, 7, 8, 11], seed: 66, inst: 'saw', bass: true, len: 32, density: .8, drone: true, drums: true },
    forest: { bpm: 96, root: 55, scale: [0, 2, 3, 5, 7, 10], seed: 31, inst: 'pluck', bass: true, len: 32, density: .5 },
    library: { bpm: 60, root: 52, scale: [0, 1, 4, 5, 7, 8, 11], seed: 404, inst: 'box', bass: true, len: 32, density: .45, drone: true },
    ending: { bpm: 66, root: 60, scale: [0, 2, 4, 5, 7, 9, 11], seed: 99, inst: 'box', bass: true, len: 32, density: .5 },
    silence: null,
  },
  gen(tr) {
    const r = RNG(tr.seed); const mel = [], bas = [];
    let deg = 4;
    for (let i = 0; i < tr.len; i++) {
      if (r() < tr.density || i % 8 === 0) { deg += Math.floor(r() * 5) - 2; deg = U.clamp(deg, 0, tr.scale.length * 2 - 1); mel.push(deg); } else mel.push(null);
      bas.push(i % 4 === 0 ? (Math.floor(i / 8) % 2 === 0 ? 0 : (r() < .5 ? 3 : 4)) : null);

    if (this.cur === name) return;

    if (AU.ok) this.nextTime = AU.ctx.currentTime + 0.1;
  },
  start() {
    if (this.timer) return;

  },
  freq(tr, deg, oct = 0) {

  },

}

  vl(x, y0, y1, col, a) { for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) this.p(x, y, col, a); }
  circ(cx, cy, r, col, a) { const rr = r * r + r * 0.8; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= rr) this.p(cx + x, cy + y, col, a); }

  ring(cx, cy, r, col) { for (let t = 0; t < Math.PI * 2; t += 0.5 / Math.max(1, r)) this.p(cx + Math.round(Math.cos(t) * r), cy + Math.round(Math.sin(t) * r), col); }

    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;

    let minY = 1e9, maxY = -1e9; for (const [, y] of pts) { minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
    for (let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
      const xs = []; const yc = y + 0.5;
      for (let i = 0; i < pts.length; i++) {
        const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % pts.length];
        if ((y0 <= yc && y1 > yc) || (y1 <= yc && y0 > yc)) xs.push(x0 + (yc - y0) / (y1 - y0) * (x1 - x0));
      }
      xs.sort((p, q) => p - q);
      for (let k = 0; k < xs.length - 1; k += 2) for (let x = Math.round(xs[k]); x < Math.round(xs[k + 1]); x++) this.p(x, y, col, a);

  outline(col, diag = false) {
    const w = this.w, h = this.h, src = new Uint8ClampedArray(this.d);
    const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : src[(y * w + x) * 4 + 3];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (A(x, y) > 0) continue;
      if (A(x - 1, y) > 128 || A(x + 1, y) > 128 || A(x, y - 1) > 128 || A(x, y + 1) > 128 ||
        (diag && (A(x - 1, y - 1) > 128 || A(x + 1, y + 1) > 128 || A(x + 1, y - 1) > 128 || A(x - 1, y + 1) > 128))) this.p(x, y, col);

  // затемнить нижнюю/правую сторону каждой формы (простая объёмность)
  shadeEdge(col, a = 120) {
    const w = this.w, h = this.h, src = new Uint8ClampedArray(this.d);
    const A = (x, y) => (x < 0 || y < 0 || x >= w || y >= h) ? 0 : src[(y * w + x) * 4 + 3];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (A(x, y) && (!A(x, y + 1) || !A(x + 1, y))) this.p(x, y, col, a);

  speck(x, y, w, h, cols, dens, seed = 1) {
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {

  map(fn) { // fn(x,y,[r,g,b,a]) → [r,g,b,a]|null
    const d = this.d;
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const i = (y * this.w + x) * 4; if (!d[i + 3]) continue;
      const o = fn(x, y, [d[i], d[i + 1], d[i + 2], d[i + 3]]); if (o) { d[i] = o[0]; d[i + 1] = o[1]; d[i + 2] = o[2]; d[i + 3] = o[3]; }
    }
  }
  blit(src, dx, dy) { // копировать другой PX (с альфой)
    for (let y = 0; y < src.h; y++) for (let x = 0; x < src.w; x++) {
      const i = (y * src.w + x) * 4; const a = src.d[i + 3]; if (!a) continue;
      this.p(dx + x, dy + y, [src.d[i], src.d[i + 1], src.d[i + 2]], a);
    }
  }
  done() { this.g.putImageData(this.img, 0, 0); return this.c; }
}

// Тайлы земли
const G_ = { GRASS: 0, DIRT: 1, COBBLE: 2, SAND: 3, WATER: 4, SWAMP: 5, CLIFF: 6, WOOD: 7, IWALL: 8, BRIDGE: 9, DFLOOR: 10, DWALL: 11, CARPET: 12, TILE: 13, VOID: 14, BLOOD: 15, STONE: 16, DGRASS: 17, PAPER: 18 };
const SOLID_GROUND = new Set([G_.WATER, G_.SWAMP, G_.CLIFF, G_.IWALL, G_.DWALL, G_.VOID, G_.BLOOD]);

const SEASON_GRASS = {
  0: ['#5f9e3c', '#6fb045', '#4f8a32', '#82c454'],   // весна
  1: ['#4c8f33', '#5aa03a', '#3f7a2a', '#6db446'],   // лето
  2: ['#a58a3c', '#b8983f', '#8a7030', '#c9a64c'],   // осень

const DUNGEON_THEMES = {
  cellar: { floor: ['#5a4636', '#4e3c2e', '#66503e'], wall: '#2e231b', wallF: ['#4a3a2c', '#3c2f24'], acc: '#8a6a4a', light: '#ffb060' },
  flooded: { floor: ['#3c4a55', '#33404a', '#465661'], wall: '#1a232b', wallF: ['#2d3b47', '#24303a'], acc: '#5f8aa6', light: '#8fd0ff' },
  flesh: { floor: ['#5c2228', '#4c1a20', '#6a2a30'], wall: '#250a0e', wallF: ['#4a1218', '#3a0d12'], acc: '#b0303c', light: '#ff5060' },
  library: { floor: ['#e8e4dc', '#dcd6cc', '#f2efe8'], wall: '#111111', wallF: ['#2a2a2a', '#1e1e1e'], acc: '#000000', light: '#ffffff' },
  abyss: { floor: ['#2a1d3a', '#22172f', '#33244a'], wall: '#0b0710', wallF: ['#1d1428', '#160f1f'], acc: '#7a4ad0', light: '#c080ff' },

function drawGroundTile(px, tx, ty, t, map) {
  const X = tx * TS, Y = ty * TS, season = map.outdoor ? S.season : 0;
  const H = (i, j, s) => U.hash(X + i, Y + j, s);
  const at = (dx, dy) => map.groundAt(tx + dx, ty + dy);
  const grassCols = map.theme === 'forest' && season !== 3 ? SEASON_GRASS[season].map(c => shade(c, -0.15)) : SEASON_GRASS[season];
  const fillNoise = (cols, s = 1) => { for (let j = 0; j < TS; j++) for (let i = 0; i < TS; i++) { const r = H(i, j, s); px.p(X + i, Y + j, r < .6 ? cols[0] : r < .82 ? cols[1] : r < .96 ? cols[2] : cols[3] || cols[0]); } };
  switch (t) {
    case G_.GRASS: case G_.DGRASS: {
      fillNoise(grassCols);
      for (let k = 0; k < 5; k++) { const i = Math.floor(H(k, 99, 3) * 15), j = Math.floor(H(k, 77, 4) * 14); px.p(X + i, Y + j, grassCols[2]); px.p(X + i, Y + j + 1, grassCols[2]); px.p(X + i + 1, Y + j - 1, grassCols[3]); }
      if (map.outdoor && season === 0 && H(5, 5, 9) < .08) { const i = 3 + Math.floor(H(1, 1, 5) * 10), j = 3 + Math.floor(H(2, 2, 5) * 10); const c = U.pick ? ['#f7e26b', '#f28cc0', '#ffffff', '#9ad0ff'][Math.floor(H(3, 3, 5) * 4)] : '#fff'; px.p(X + i, Y + j, c); px.p(X + i + 1, Y + j, c); px.p(X + i, Y + j + 1, c); px.p(X + i + 1, Y + j + 1, '#d1a020'); }
      break;
    }
    case G_.DIRT: {
      const c = season === 3 ? ['#b9b3ad', '#a59e97', '#d6d2cf', '#8f877f'] : ['#a3784a', '#94693f', '#b38957', '#7c5733'];
      fillNoise(c, 2);
      for (let k = 0; k < 3; k++) { const i = Math.floor(H(k, 3, 8) * 14), j = Math.floor(H(k, 4, 8) * 14); px.p(X + i, Y + j, c[3]); px.p(X + i + 1, Y + j, shade(c[1], .2)); }
      // травяная кромка
      const g = grassCols;
      if (at(0, -1) === G_.GRASS) for (let i = 0; i < 16; i++) { const d = 1 + Math.floor(H(i, 0, 11) * 3); for (let j = 0; j < d; j++) px.p(X + i, Y + j, g[j === d - 1 ? 2 : 0]); }
      if (at(0, 1) === G_.GRASS) for (let i = 0; i < 16; i++) { const d = Math.floor(H(i, 1, 12) * 2); for (let j = 0; j < d; j++) px.p(X + i, Y + 15 - j, g[0]); }
      if (at(-1, 0) === G_.GRASS) for (let j = 0; j < 16; j++) { const d = 1 + Math.floor(H(0, j, 13) * 2); for (let i = 0; i < d; i++) px.p(X + i, Y + j, g[0]); }
      if (at(1, 0) === G_.GRASS) for (let j = 0; j < 16; j++) { const d = 1 + Math.floor(H(1, j, 14) * 2); for (let i = 0; i < d; i++) px.p(X + 15 - i, Y + j, g[0]); }
      break;
    }
    case G_.COBBLE: case G_.STONE: {
      const base = t === G_.STONE ? '#6d6a70' : (season === 3 ? '#9aa3ad' : '#8a8580');
      px.r(X, Y, 16, 16, shade(base, -0.35));
      const stones = [[3, 3, 3, 2], [10, 2, 3, 2], [6, 8, 3, 3], [13, 9, 2, 2], [2, 12, 2, 2], [10, 13, 3, 2]];
      for (const [cx, cy, rx, ry] of stones) { px.ell(X + cx, Y + cy, rx, ry, shade(base, (H(cx, cy, 2) - .5) * .25)); px.p(X + cx - 1, Y + cy - 1, shade(base, .25)); }
      break;
    }
    case G_.SAND: fillNoise(['#e4cf95', '#d9c085', '#efdcaa', '#c9ad70'], 4); break;
    case G_.WATER: case G_.SWAMP: case G_.BLOOD: {
      const base = t === G_.SWAMP ? ['#3e5e3a', '#36522f', '#4b6d44'] : t === G_.BLOOD ? ['#7a0c18', '#650a14', '#8f1420'] : (map.theme === 'dungeon' ? ['#28445e', '#223a52', '#30506c'] : ['#3d74b8', '#3567a6', '#4a84c8']);
      for (let j = 0; j < TS; j++) for (let i = 0; i < TS; i++) { const r = H(i, j, 6); px.p(X + i, Y + j, r < .7 ? base[0] : r < .9 ? base[1] : base[2]); }
      for (let k = 0; k < 2; k++) { const i = Math.floor(H(k, 7, 5) * 11), j = Math.floor(H(k, 8, 5) * 15); px.hl(X + i, X + i + 3, Y + j, shade(base[2], .25)); }
      const foam = t === G_.SWAMP ? '#7a9a5a' : t === G_.BLOOD ? '#c0303c' : '#a8d4f5';
      const land = (dx, dy) => { const n = at(dx, dy); return n !== null && !WATERY.has(n) && n !== G_.BRIDGE; };
      if (land(0, -1)) { px.hl(X, X + 15, Y, shade(base[0], -0.4)); px.hl(X, X + 15, Y + 1, shade(base[0], -0.25)); px.hl(X, X + 15, Y + 2, foam, 140); }
      if (land(0, 1)) { px.hl(X, X + 15, Y + 15, foam); px.hl(X, X + 15, Y + 14, foam, 120); }
      if (land(-1, 0)) { px.vl(X, Y, Y + 15, foam); px.vl(X + 1, Y, Y + 15, foam, 110); }
      if (land(1, 0)) { px.vl(X + 15, Y, Y + 15, foam); px.vl(X + 14, Y, Y + 15, foam, 110); }
      if (t === G_.SWAMP && H(1, 1, 33) < .15) { px.ell(X + 8, Y + 8, 3, 2, '#5f9e3c'); px.p(X + 8, Y + 7, '#3d6e28'); }
      break;
    }
    case G_.CLIFF: {
      const below = at(0, 1);
      if (below !== G_.CLIFF && below !== null) { // лицевая сторона скалы
        px.r(X, Y, 16, 16, '#6b5a48');
        for (let j = 0; j < 16; j += 4) for (let i = 0; i < 16; i++) if (H(i, j, 3) < .5) px.p(X + i, Y + j, '#4f4235');
        for (let i = 0; i < 16; i++) { px.p(X + i, Y + 15, '#3a3027'); px.p(X + i, Y, '#8a7860'); }
      } else { fillNoise(season === 3 ? ['#dfe6ee', '#cfd8e2', '#f0f4f8', '#b8c4d0'] : ['#4a5a3a', '#405032', '#55663f', '#384628'], 9); }
      break;
    }
    case G_.WOOD: {
      for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) { const row = Math.floor(j / 4); px.p(X + i, Y + j, (j % 4 === 3) ? '#5a3a1e' : (H(i, row, 2) < .2 ? '#a06e3e' : '#94643a')); }
      for (let r = 0; r < 4; r++) { const off = Math.floor(H(r, ty, 7) * 16); px.vl(X + off, Y + r * 4, Y + r * 4 + 2, '#6e4a28'); }
      break;
    }
    case G_.IWALL: {
      const pal = map.wall || ['#7b5a8c', '#6a4b7a', '#c9a24a'];
      const below = at(0, 1);
      px.r(X, Y, 16, 16, pal[0]);
      for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) if ((i + tx * 16) % 8 < 2) px.p(X + i, Y + j, pal[1]);
      for (let i = 0; i < 16; i += 8) { px.p(X + i + 4, Y + 5, pal[2]); px.p(X + i + 4, Y + 11, pal[2]); }
      if (below !== G_.IWALL && below !== null) { px.r(X, Y + 12, 16, 4, '#4a2e18'); px.hl(X, X + 15, Y + 12, '#7a5030'); px.hl(X, X + 15, Y + 15, '#2a1a0e'); }
      if (at(0, -1) !== G_.IWALL) px.r(X, Y, 16, 2, '#2a1a0e');
      break;
    }
    case G_.BRIDGE: {
      const vert = WATERY.has(at(-1, 0) || 0) && WATERY.has(at(1, 0) || 0);
      px.r(X, Y, 16, 16, '#8a5a30');
      if (vert) { for (let j = 0; j < 16; j += 4) { px.hl(X, X + 15, Y + j, '#5a3818'); } px.vl(X, Y, Y + 15, '#4a2e14'); px.vl(X + 15, Y, Y + 15, '#4a2e14'); }
      else { for (let i = 0; i < 16; i += 4) { px.vl(X + i, Y, Y + 15, '#5a3818'); } px.hl(X, X + 15, Y, '#4a2e14'); px.hl(X, X + 15, Y + 15, '#4a2e14'); }
      break;
    }
    case G_.DFLOOR: {
      const th = DUNGEON_THEMES[map.dtheme || 'cellar'];
      fillNoise(th.floor.concat([shade(th.floor[0], .1)]), 21);
      if (H(0, 0, 40) < .25) { const i = Math.floor(H(1, 0, 41) * 10) + 2, j = Math.floor(H(0, 1, 42) * 10) + 2; px.line(X + i, Y + j, X + i + 3, Y + j + 2, shade(th.floor[0], -.3)); px.line(X + i + 3, Y + j + 2, X + i + 4, Y + j + 5, shade(th.floor[0], -.3)); }
      if (map.dtheme === 'library' && H(2, 2, 43) < .3) { const j = 3 + Math.floor(H(3, 3, 44) * 10); px.hl(X + 2, X + 2 + Math.floor(H(4, 4, 45) * 10), Y + j, '#999'); }
      if (map.dtheme === 'flesh' && H(5, 5, 46) < .2) { px.circ(X + 8, Y + 8, 2, '#8a1a24'); }
      break;
    }
    case G_.DWALL: {
      const th = DUNGEON_THEMES[map.dtheme || 'cellar'];
      const below = at(0, 1);
      if (below !== null && below !== G_.DWALL && below !== G_.VOID) {
        for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) { const brick = ((Math.floor(j / 4) % 2) ? (i + 4) : i) % 8 === 0 || j % 4 === 0; px.p(X + i, Y + j, brick ? th.wallF[1] : th.wallF[0]); }
        px.hl(X, X + 15, Y, shade(th.wallF[0], .25)); px.hl(X, X + 15, Y + 15, shade(th.wallF[1], -.4));
        if (map.dtheme === 'library') { for (let i = 1; i < 15; i += 3) { px.r(X + i, Y + 3, 2, 10, ['#7a2a2a', '#2a3a6a', '#3a5a2a', '#5a4a2a'][Math.floor(H(i, ty, 5) * 4)]); } px.hl(X, X + 15, Y + 13, '#3a2a1a'); }
        if (map.dtheme === 'flesh' && H(3, 3, 9) < .3) { px.ell(X + 8, Y + 8, 3, 2, '#f0e0d0'); px.circ(X + 8, Y + 8, 1, '#200'); }
      } else { px.r(X, Y, 16, 16, th.wall); for (let k = 0; k < 4; k++) px.p(X + Math.floor(H(k, 1, 3) * 16), Y + Math.floor(H(k, 2, 3) * 16), shade(th.wall, .15)); }
      break;
    }
    case G_.CARPET: { px.r(X, Y, 16, 16, '#8a2030'); for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) if ((i + j) % 6 === 0) px.p(X + i, Y + j, '#a8343f'); px.r(X, Y, 16, 1, '#c9a24a', 80); break; }
    case G_.TILE: { for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) px.p(X + i, Y + j, ((i >> 3) + (j >> 3)) % 2 ? '#d8e2e6' : '#b9cad2'); break; }
    case G_.PAPER: { px.r(X, Y, 16, 16, '#efece4'); for (let j = 2; j < 16; j += 4) px.hl(X, X + 15, Y + j, '#cfd6e0'); if (tx % 6 === 0) px.vl(X + 2, Y, Y + 15, '#e0a0a0'); break; }
    case G_.VOID: default: px.r(X, Y, 16, 16, '#000'); break;
  }
}

/* ---------- объекты (16x16 и крупнее) ---------- */
const OBJ_ART = {};
function treeSprite(kind, season, stage = 3, face = false) {

    if (stage < 3) { // саженец
      const p = new PX(16, 16);
      p.vl(8, 6, 15, '#6a4a2a'); p.circ(8, 6 - stage, 2 + stage, season === 2 ? '#c87a30' : '#4f9a3a'); p.outline('#1d2a14'); return p.done();

    p.r(13, 30, 6, 17, trunk); p.vl(13, 30, 46, trunkD); p.vl(18, 30, 46, shade(trunk, .2));
    p.r(11, 44, 10, 3, trunk); p.p(10, 46, trunk); p.p(21, 46, trunk);
    if (face) { p.r(14, 35, 1, 2, '#000'); p.r(17, 35, 1, 2, '#000'); p.p(14, 35, '#ff2030'); p.p(17, 35, '#ff2030'); p.hl(14, 17, 40, '#000'); p.p(15, 41, '#000'); }
    const seasonCols = {
      oak: [['#5aa83c', '#3d8a2c', '#7cc458', '#f4a6c8'], ['#3f8f2e', '#2c6e22', '#5aab3c'], ['#d9772b', '#b0521e', '#f0a040'], null],

      dead: [null, null, null, null],
    }[kind] || [];
    const cols = seasonCols[season];
    if (kind === 'pine') {
      const c = cols;
      for (let k = 0; k < 4; k++) { const y0 = 4 + k * 7, w = 5 + k * 3; p.poly([[16, y0 - 2], [16 + w, y0 + 10], [16 - w, y0 + 10]], c[0]); p.poly([[16, y0 - 2], [16 + w, y0 + 10], [17, y0 + 10]], c[1]); if (season === 3) { p.hl(16 - w + 2, 16 + w - 2, y0 + 9, '#ffffff'); p.p(16, y0 - 1, '#fff'); } }
      p.speck(4, 2, 24, 34, [c[2]], .05, 3);
    } else if (cols) {
      const blobs = [[16, 14, 11], [8, 20, 7], [24, 20, 7], [12, 9, 7], [21, 9, 7], [16, 24, 8]];

      for (const [x, y, r] of blobs) p.circ(x - 3, y - 4, Math.max(1, r - 5), cols[2]);
      if (cols[3]) p.speck(2, 2, 28, 28, [cols[3]], .04, 5);
      if (kind === 'oak' && season === 2) p.speck(2, 2, 28, 28, ['#8a3a10'], .05, 6);

      if (season === 3 && kind !== 'dead') { p.p(6, 9, '#fff'); p.p(26, 5, '#fff'); p.p(16, 5, '#fff'); p.p(25, 15, '#fff'); }
    }
    p.outline('#14200f');
    return p.done();
  });
}

      p.r(4, 6, 3, 24, '#5a3a20'); p.r(25, 6, 3, 24, '#5a3a20'); p.poly([[0, 8], [32, 8], [16, -1]], '#7a2a2a'); p.hl(0, 31, 8, '#4a1a1a');
      p.hl(7, 24, 14, '#6a4a2a'); p.vl(16, 14, 22, '#c8b080'); p.r(14, 22, 5, 4, '#6a4a2a');
      if (o.hand) { p.r(12, 22, 3, 6, '#d8d8d0'); p.p(11, 22, '#d8d8d0'); p.p(15, 21, '#d8d8d0'); p.p(13, 21, '#d8d8d0'); }
      p.outline('#1a1010'); return p.done();
    });
    case 'cart': return spr('cart', () => { const p = new PX(32, 32); p.r(2, 12, 28, 12, '#7a3a8a'); p.r(2, 10, 28, 3, '#5a2a6a'); p.poly([[0, 12], [32, 12], [26, 2], [6, 2]], '#e070c0'); for (let x = 2; x < 30; x += 6) p.poly([[x, 12], [x + 3, 12], [x + 2, 4]], '#ffffff', 90); p.circ(8, 26, 4, '#4a2a1a'); p.circ(24, 26, 4, '#4a2a1a'); p.circ(8, 26, 1, '#c9a24a'); p.circ(24, 26, 1, '#c9a24a'); p.outline('#1a0a1a'); return p.done(); });
    case 'fog': return spr(`fog:${frame % 4}`, () => { const p = new PX(16, 16); for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) { const r = U.hash(i + frame, j, 3); if (r < .55) p.p(i, j, '#ffffff', 60 + Math.floor(r * 120)); } return p.done(); });
    case 'bloodstain': return spr(`blood:${frame % 4}`, () => { const p = new PX(16, 16); p.ell(8, 10, 6, 3, '#8a0010'); p.ell(7, 10, 3, 2, '#c01020'); p.circ(8, 6 - frame % 4, 1, '#60ff90', 160); return p.done(); });

/* ---------- постройки ---------- */
function buildingSprite(kind, night = false) {
  return spr(`bld:${kind}:${night ? 1 : 0}:${S.season === 3 ? 1 : 0}:${S.flags && S.flags.greenhouse ? 1 : 0}`, () => {
    const B = BUILD_STYLES[kind];
    const w = B.w * 16, h = (B.h + B.roofH) * 16;
    const p = new PX(w, h);
    const wallTop = B.roofH * 16 - 4, wallH = h - wallTop;
    const snow = S.season === 3;
    // стены
    p.r(0, wallTop, w, wallH, B.wall);
    if (B.planks) for (let y = wallTop; y < h; y += 4) p.hl(0, w - 1, y, shade(B.wall, -.18));
    if (B.bricks) for (let y = wallTop; y < h; y += 4) for (let x = ((y / 4) % 2) * 4; x < w; x += 8) p.vl(x, y, y + 3, shade(B.wall, -.2));
    if (B.logs) for (let y = wallTop; y < h; y += 5) { p.hl(0, w - 1, y, shade(B.wall, -.3)); p.hl(0, w - 1, y + 1, shade(B.wall, .15)); }
    p.vl(0, wallTop, h - 1, shade(B.wall, -.35)); p.vl(w - 1, wallTop, h - 1, shade(B.wall, -.35));
    p.hl(0, w - 1, h - 1, shade(B.wall, -.45)); p.hl(0, w - 1, h - 2, shade(B.wall, -.3));
    // крыша
    const rc = B.roof, rd = shade(rc, -.25), rl = shade(rc, .2);
    if (B.roofStyle === 'gable') {
      p.poly([[-2, wallTop + 6], [w + 2, wallTop + 6], [w - 10, 2], [10, 2]], rc);
      for (let y = 4; y < wallTop + 6; y += 4) p.hl(0, w - 1, y, rd);
      p.hl(-2, w + 2, wallTop + 6, shade(rc, -.45)); p.hl(10, w - 10, 2, rl);
      if (snow) { p.poly([[10, 2], [w - 10, 2], [w - 6, 7], [6, 7]], '#f4f8fb'); for (let x = 4; x < w - 4; x += 5) p.vl(x, 7, 7 + (x % 3), '#f4f8fb'); }
    } else if (B.roofStyle === 'spire') { // часовня
      p.poly([[-2, wallTop + 6], [w + 2, wallTop + 6], [w / 2, 10]], rc);
      for (let y = 14; y < wallTop + 6; y += 4) p.hl(0, w - 1, y, rd, 140);
      p.r(w / 2 - 5, 0, 10, 20, shade(B.wall, -.1)); p.poly([[w / 2 - 6, 4], [w / 2 + 6, 4], [w / 2, -12]], rd);
      p.vl(w / 2, -2, 6, '#c9a24a'); p.hl(w / 2 - 2, w / 2 + 2, 1, '#c9a24a');
      p.circ(w / 2, 12, 3, '#3a2a4a'); p.circ(w / 2, 12, 2, night ? '#ffd070' : '#7a6aa0');
      if (!S.flags || !S.flags.chapelDone) { p.line(w / 2 - 14, 18, w / 2 - 6, 26, '#000'); p.r(w - 20, wallTop - 2, 6, 4, '#000'); }
    } else if (B.roofStyle === 'crooked') { // ведьма
      p.poly([[-4, wallTop + 6], [w + 4, wallTop + 2], [w / 2 + 10, -4], [w / 2 - 2, 8]], rc);
      for (let y = 6; y < wallTop + 6; y += 5) p.hl(0, w - 1, y, rd, 150);
      p.r(w - 18, 0, 6, 14, '#5a5050'); p.circ(w - 15, -2, 3, '#aaa', 120);
    } else if (B.roofStyle === 'glass') {
      p.r(0, 4, w, wallTop + 2, B.flags_broken && !(S.flags && S.flags.greenhouse) ? '#5a6a6a' : '#9fd8e8');
      for (let x = 0; x < w; x += 8) p.vl(x, 4, wallTop + 6, '#e8f8ff'); for (let y = 4; y < wallTop + 6; y += 8) p.hl(0, w - 1, y, '#e8f8ff');
      if (!(S.flags && S.flags.greenhouse)) { for (let k = 0; k < 9; k++) { const x = Math.floor(U.hash(k, 1, 7) * w), y = 6 + Math.floor(U.hash(k, 2, 7) * wallTop); p.r(x, y, 5, 4, '#1a2420'); } }
    } else { // flat с карнизом
      p.r(-2, wallTop - 6, w + 4, 12, rc); p.hl(-2, w + 2, wallTop - 6, rl); p.hl(-2, w + 2, wallTop + 5, rd);
      for (let x = 0; x < w; x += 6) p.vl(x, wallTop - 5, wallTop + 4, rd, 120);
    }
    // окна
    for (const [wx, wy] of B.windows || []) {
      const x = wx * 16 + 3, y = wallTop + wy;
      p.r(x - 1, y - 1, 12, 11, '#3a2410'); p.r(x, y, 10, 9, night ? '#ffd070' : '#7fb6d8');
      if (!night) { p.line(x + 1, y + 6, x + 5, y + 1, '#d8eef8'); } p.vl(x + 5, y, y + 8, '#3a2410'); p.hl(x, x + 9, y + 4, '#3a2410');
      p.r(x - 2, y + 9, 14, 2, '#5a3a20');
      if (night && S.sanity < 35 && U.hash(wx, wy, kind.length) < .5) { p.r(x + 2, y + 2, 2, 5, '#000'); p.p(x + 2, y + 3, '#f00'); }
    }
    // дверь
    if (B.door !== undefined) {
      const dx = B.door * 16 + 2, dy = h - 22;
      p.r(dx - 1, dy - 1, 14, 23, '#2a1a0a'); p.r(dx, dy, 12, 22, B.doorCol || '#6a3a1a'); p.vl(dx + 6, dy, dy + 21, shade(B.doorCol || '#6a3a1a', -.3));
      p.p(dx + 9, dy + 12, '#f2c430'); p.p(dx + 3, dy + 12, '#f2c430');
    }
    // вывеска
    if (B.sign) {
      const sx = B.sign[0] * 16, sy = wallTop + B.sign[1];
      p.r(sx, sy, 28, 12, '#3a2410'); p.r(sx + 1, sy + 1, 26, 10, '#c4955a');
      drawSignIcon(p, B.signIcon, sx + 8, sy + 2);
    }
    if (B.extra) B.extra(p, w, h, wallTop, night);
    p.outline('#140c06');
    return p.done();
  });
}
function drawSignIcon(p, ic, x, y) {
  switch (ic) {
    case 'seed': p.ell(x + 6, y + 4, 3, 3, '#4a8a2a'); p.vl(x + 6, y + 1, y + 7, '#2a5a1a'); break;
    case 'mug': p.r(x + 2, y + 1, 7, 7, '#e8c060'); p.r(x + 2, y + 1, 7, 2, '#ffffff'); p.r(x + 9, y + 3, 2, 3, '#e8c060'); break;
    case 'cross': p.r(x + 5, y, 3, 8, '#c00'); p.r(x + 2, y + 3, 9, 3, '#c00'); break;
    case 'hammer': p.r(x + 2, y, 8, 3, '#555'); p.vl(x + 6, y + 3, y + 8, '#7a4a24'); break;
    case 'star': p.p(x + 6, y, '#c9a24a'); p.hl(x + 3, x + 9, y + 3, '#c9a24a'); p.r(x + 4, y + 1, 5, 6, '#c9a24a'); break;
    case 'potion': p.r(x + 5, y, 3, 2, '#888'); p.circ(x + 6, y + 5, 3, '#4af04a'); break;
  }
}

/* ============================================================
   Персонажи: спрайты 16x32, портреты 64x64, монстры
   ============================================================ */
const OUTLINE = '#1d1214';

function drawChar(L, dir, frame) {
  const key = `ch:${L.id || JSON.stringify(L)}:${dir}:${frame}`;
  return spr(key, () => {
    const p = new PX(16, 32);
    const sk = L.skin || '#f2c6a0', skD = shade(sk, -.18), hr = L.hair || '#3a2a1a', hrD = shade(hr, -.3), hrL = shade(hr, .25);
    const top = L.top || '#4a6a9a', topD = shade(top, -.25), bot = L.bottom || '#3a3a4a', shoe = L.shoes || '#2a1a10';
    const fem = !!L.fem, st = L.hairStyle || 'short', ghost = !!L.ghost;
    const step = frame === 1 ? 1 : frame === 2 ? 2 : 0;
    const longHair = ['long', 'veil', 'twintail', 'wavy'].includes(st);

    if (dir === 'down' || dir === 'up') {
      const back = dir === 'up';
      // волосы сзади (длинные)
      if (longHair && !back) { p.r(3, 9, 10, 13, hrD); }
      if (st === 'twintail') { p.r(1, 8, 2, 13, hr); p.r(13, 8, 2, 13, hr); p.p(1, 21, hrD); p.p(14, 21, hrD); }
      // туловище
      const armSw = step === 1 ? -1 : step === 2 ? 1 : 0;
      const torso = (y, x0, x1, c) => p.hl(x0, x1, y, c);
      for (let y = 18; y <= 25; y++) {
        let x0 = 4, x1 = 11;
        if (fem && (y === 21 || y === 22)) { x0 = 5; x1 = 10; }
        torso(y, x0, x1, top);
      }
      p.vl(11, 18, 25, topD);
      // вырез
      if (!back && L.neck === 'v') { p.hl(6, 9, 18, sk); p.hl(7, 8, 19, sk); if (fem) p.p(7, 20, skD); }
      if (!back && L.neck === 'corset') { p.hl(5, 10, 18, sk); p.p(5, 19, sk); p.p(10, 19, sk); p.p(7, 19, skD); p.p(8, 19, skD); for (let y = 20; y <= 24; y += 2) { p.p(7, y, shade(top, .5)); p.p(8, y + 1, shade(top, .5)); } }
      if (!back && L.neck === 'bunny') { p.hl(4, 11, 18, sk); p.hl(4, 11, 19, sk); p.p(7, 19, skD); p.p(7, 17, '#fff'); p.p(8, 17, '#fff'); p.p(7, 18, '#d02030'); p.p(8, 18, '#d02030'); }
      if (!back && L.neck === 'collar') { p.hl(6, 9, 18, '#ffffff'); p.p(7, 19, '#ffffff'); }
      if (!back && L.neck === 'ruff') { p.hl(3, 12, 17, '#ffffff'); p.hl(4, 11, 18, '#e8e8e8'); }
      if (L.apron && !back) { p.r(5, 20, 6, 8, L.apron); }
      if (L.belt) p.hl(fem ? 5 : 4, fem ? 10 : 11, 22, L.belt);
      // руки
      const sl = L.sleeve === 'none' ? sk : top;
      p.vl(3, 18 + Math.max(0, armSw), 23 + armSw, sl); p.vl(12, 18 + Math.max(0, -armSw), 23 - armSw, sl);
      p.p(3, 24 + armSw, sk); p.p(12, 24 - armSw, sk);
      if (fem && L.sleeve !== 'none') { p.p(3, 18, sk); p.p(12, 18, sk); }
      // низ
      const bs = L.bottomStyle || 'pants';
      if (ghost) {
        for (let y = 24; y < 32; y++) { const a = 255 - (y - 24) * 30; for (let x = 3; x <= 12; x++) if (!(y > 28 && (x + y + frame) % 3 === 0)) p.p(x, y, bot, a); }
      } else if (bs === 'skirt') {

        p.ell(16, 14, 7, 8, '#f4e8e0'); p.ell(16, 10, 9, 6, '#1a1418'); p.r(7, 10, 3, 16, '#1a1418'); p.r(22, 10, 3, 16, '#1a1418');
        p.r(12, 14, 2, 3, '#000'); p.r(18, 14, 2, 3, '#000'); p.p(12, 15, '#d02030'); p.p(19, 15, '#d02030');
        p.hl(13, 19, 19, '#800010');
        p.poly([[4, 4], [12, 7], [4, 10]], '#f0f0f0'); p.poly([[28, 4], [20, 7], [28, 10]], '#f0f0f0'); p.circ(16, 6, 2, '#b01020');
        for (let k = 0; k < 6; k++) p.p(4 + Math.floor(U.hash(k, s, 3) * 24), 30 + Math.floor(U.hash(s, k, 4) * 20), '#000');
        p.outline('#000'); return p.done();
      }
      case 'fairy': {
        const p = new PX(16, 16); const s = frame % 2;
        p.ell(4, 7 - s, 3, 4, '#d8ffe8', 160); p.ell(12, 7 - s, 3, 4, '#d8ffe8', 160);
        p.circ(8, 6, 2, '#f8e0c8'); p.hl(6, 10, 4, '#5aca5a'); p.r(7, 8, 3, 5, '#7ad87a'); p.p(7, 6, '#000'); p.p(9, 6, '#000');
        return p.done();
      }
      case 'zhmur': {
        const col = ['#9aff9a', '#ffd070', '#9ad0ff', '#ff9ad0', '#d0a0ff'][Number(variant) || 0];
        const p = new PX(12, 14); const s = frame % 2;
        p.ell(6, 8 + s, 5, 5 - s, col); p.p(4, 7 + s, '#000'); p.p(7, 7 + s, '#000'); p.vl(6, 1 + s, 3 + s, '#3a8a3a'); p.p(7, 1 + s, '#5ac85a');
        p.outline('#1a2a1a'); return p.done();
      }
      case 'frog': {
        const p = new PX(16, 16); const s = frame % 2;
        p.ell(8, 11 - s, 6, 4, '#4a9a3a'); p.circ(5, 7 - s, 2, '#5aab3c'); p.circ(11, 7 - s, 2, '#5aab3c'); p.p(5, 7 - s, '#000'); p.p(11, 7 - s, '#000');
        p.poly([[6, 5 - s], [10, 5 - s], [10, 2 - s], [8, 4 - s], [6, 2 - s]], '#f2c430'); p.hl(6, 10, 12 - s, '#2a5a1a');
        p.outline('#0a1a08'); return p.done();
      }
    }
    return mkCanvas(16, 16);
  });
}

/* ============================================================

const TIER_COL = ['#8a8a8a', '#c87a3a', '#d8dee6', '#f2c430', '#a0204a'];
const ICON = {
  tool(p, [kind, tier = 0]) {
    const m = TIER_COL[tier], h = '#7a4a24';
    switch (kind) {
      case 'hoe': p.line(3, 14, 11, 4, h); p.line(4, 14, 12, 4, shade(h, .2)); p.r(9, 2, 5, 3, m); p.r(12, 2, 2, 6, m); break;
      case 'can': p.r(3, 6, 8, 7, m); p.r(3, 6, 8, 2, shade(m, .3)); p.line(11, 8, 14, 5, m); p.p(15, 4, m); p.ring(6, 5, 2, shade(m, -.3)); p.p(5, 10, '#4aa0ff'); break;
      case 'axe': p.line(4, 14, 10, 3, h); p.line(5, 14, 11, 3, shade(h, .2)); p.poly([[8, 2], [14, 3], [13, 9], [9, 7]], m); p.line(13, 3, 13, 8, shade(m, .4)); break;
      case 'pick': p.line(4, 14, 10, 4, h); p.line(5, 14, 11, 4, shade(h, .2)); p.line(3, 5, 8, 2, m); p.line(8, 2, 14, 5, m); p.line(3, 6, 8, 3, shade(m, -.2)); p.line(8, 3, 14, 6, shade(m, -.2)); break;
      case 'scythe': p.line(4, 15, 9, 3, h); p.poly([[8, 2], [15, 3], [13, 6], [10, 4]], m); p.line(9, 2, 15, 3, shade(m, .5)); break;
      case 'rod': p.line(2, 15, 13, 2, h); p.line(3, 15, 14, 2, shade(h, .3)); p.line(14, 2, 14, 10, '#ddd'); p.p(14, 11, '#d02030'); p.r(3, 11, 3, 3, '#3a3a3a'); break;
    }
  },
  sword(p, [blade = '#c8d0d8', hilt = '#7a4a24', style = 0]) {
    if (style === 1) { p.poly([[3, 13], [12, 2], [14, 4], [5, 14]], blade); } // широкий
    else if (style === 2) { p.line(3, 13, 13, 3, blade); p.line(4, 13, 14, 3, shade(blade, .4)); p.line(13, 3, 14, 1, blade); } // рапира
    else if (style === 3) { p.poly([[3, 12], [10, 5], [14, 1], [13, 6], [5, 14]], blade); p.line(6, 11, 13, 3, shade(blade, .5)); } // лунный
    else if (style === 4) { p.line(3, 13, 9, 7, blade); p.line(4, 13, 10, 7, shade(blade, .4)); p.p(10, 6, blade); } // сломанный
    else if (style === 5) { p.line(3, 13, 12, 4, '#2a2a2a'); p.poly([[10, 6], [15, 0], [13, 5]], '#f0eadc'); } // перо
    else { p.line(3, 12, 13, 2, blade); p.line(4, 12, 14, 2, shade(blade, .4)); p.line(4, 13, 14, 3, shade(blade, -.2)); }
    p.line(2, 10, 6, 14, '#5a4a3a'); p.line(1, 15, 4, 12, hilt); p.p(1, 15, shade(hilt, -.3));
  },
  seed(p, [c1, c2 = '#6a4a2a']) {
    p.r(3, 2, 10, 12, '#e8dcc0'); p.r(3, 2, 10, 3, c1); p.r(4, 6, 8, 6, shade(c1, .5));
    p.ell(8, 9, 2, 2, c1); p.p(7, 8, shade(c1, .5)); p.hl(5, 10, 13, '#c8b898');
    for (let k = 0; k < 3; k++) p.p(5 + k * 3, 3, c2);
  },
  root(p, [c = '#f2e0a0', leaf = '#4a9a3a']) { p.poly([[5, 6], [11, 6], [9, 15], [7, 15]], c); p.line(6, 8, 9, 9, shade(c, -.2)); p.line(7, 11, 9, 12, shade(c, -.2)); p.line(8, 6, 5, 1, leaf); p.line(8, 6, 8, 0, leaf); p.line(8, 6, 11, 1, leaf); },
  round(p, [c, c2, eyes = 0, stem = '#4a7a2a']) { p.circ(8, 9, 5, c); p.circ(6, 7, 2, shade(c, .25)); if (c2) p.speck(4, 5, 9, 9, [c2], .1, 3); if (eyes) { p.r(5, 8, 2, 2, '#fff'); p.r(9, 8, 2, 2, '#fff'); p.p(6, 9, '#000'); p.p(10, 9, '#000'); } if (stem) p.vl(8, 2, 4, stem); },
  brain(p) { p.circ(8, 8, 6, '#f0a0b0'); p.line(8, 3, 8, 13, '#c06070'); for (const [a, b, c, d] of [[3, 6, 6, 8], [10, 7, 13, 5], [4, 11, 7, 10], [9, 11, 12, 12], [5, 4, 7, 6]]) p.line(a, b, c, d, '#c06070'); p.r(5, 13, 6, 2, '#4a9a3a'); },
  garlic(p) { p.ell(8, 10, 5, 4, '#f4f0e6'); p.vl(8, 7, 13, '#d8d0c0'); p.vl(5, 8, 12, '#d8d0c0'); p.vl(11, 8, 12, '#d8d0c0'); p.line(8, 6, 8, 1, '#7aaa5a'); },
  heart(p, [c = '#d82030']) { p.circ(5, 7, 3, c); p.circ(11, 7, 3, c); p.poly([[2, 8], [14, 8], [8, 15]], c); p.p(4, 5, '#ff9aa0'); p.hl(6, 10, 3, '#3a7a2a'); p.vl(8, 1, 3, '#3a7a2a'); },
  eyeberry(p) { for (const [x, y] of [[5, 6], [10, 7], [7, 11]]) { p.circ(x, y, 3, '#3a5ad0'); p.circ(x, y, 1, '#fff'); p.p(x, y, '#000'); } },
  skull(p) { p.ell(8, 8, 6, 6, '#7ac85a'); p.r(5, 7, 2, 2, '#1a3a1a'); p.r(9, 7, 2, 2, '#1a3a1a'); p.hl(6, 10, 11, '#1a3a1a'); p.p(7, 12, '#1a3a1a'); p.p(9, 12, '#1a3a1a'); p.line(3, 4, 5, 6, '#4a8a3a'); },
  pepper(p) { p.poly([[6, 4], [10, 4], [12, 9], [9, 15], [5, 9]], '#e02020'); p.line(7, 5, 6, 10, '#ff8080'); p.line(8, 4, 9, 1, '#3a7a2a'); },
  sunflower(p) { for (let a = 0; a < 8; a++) p.circ(8 + Math.round(Math.cos(a) * 4), 7 + Math.round(Math.sin(a) * 4), 2, '#f2c430'); p.circ(8, 7, 3, '#5a3a1a'); p.p(7, 6, '#fff'); p.p(9, 6, '#fff'); p.p(7, 7, '#000'); p.p(9, 7, '#000'); p.vl(8, 11, 15, '#3a7a2a'); },
  pumpkin(p, [face = 1]) { p.ell(8, 9, 7, 5, '#e07a20'); p.vl(5, 5, 13, '#b05a10'); p.vl(11, 5, 13, '#b05a10'); p.vl(8, 1, 4, '#4a6a2a'); if (face) { p.poly([[4, 7], [6, 7], [5, 9]], '#3a1a00'); p.poly([[10, 7], [12, 7], [11, 9]], '#3a1a00'); p.hl(5, 11, 11, '#3a1a00'); } },
  eggplant(p) { p.ell(9, 10, 4, 5, '#5a2a7a'); p.ell(8, 9, 2, 3, '#7a4a9a'); p.poly([[6, 4], [11, 4], [9, 6]], '#4a7a2a'); },
  cranberry(p) { for (const [x, y] of [[5, 6], [10, 6], [7, 10], [11, 11], [4, 11]]) { p.circ(x, y, 2, '#a01020'); p.p(x - 1, y - 1, '#ff6070'); } },
  beet(p) { p.circ(8, 10, 5, '#8a1a3a'); p.p(6, 8, '#c04060'); p.vl(8, 14, 15, '#8a1a3a'); p.line(8, 5, 5, 0, '#3a8a3a'); p.line(8, 5, 11, 0, '#a03050'); },
  mandrake(p) { p.poly([[5, 5], [11, 5], [12, 11], [9, 15], [7, 15], [4, 11]], '#c8a070'); p.p(6, 8, '#000'); p.p(9, 8, '#000'); p.ell(8, 11, 1, 1, '#3a1a0a'); p.line(4, 10, 1, 12, '#c8a070'); p.line(12, 10, 15, 12, '#c8a070'); p.line(8, 5, 5, 0, '#3a8a3a'); p.line(8, 5, 11, 0, '#3a8a3a'); },
  blackfruit(p) { p.circ(8, 9, 5, '#0a0a0e'); p.circ(6, 7, 1, '#4a2a6a'); p.vl(8, 1, 4, '#2a1a2a'); p.p(9, 9, '#d02030'); p.ring(8, 9, 6, '#6a2a9a'); },
  blackseed(p) { p.ell(8, 9, 3, 4, '#0a0a0e'); p.p(7, 7, '#5a3a8a'); p.ring(8, 9, 5, '#6a2a9a'); p.p(8, 9, '#d02030'); },
  flower(p, [c = '#f2e040', ctr = '#c87a20']) { for (let a = 0; a < 5; a++) p.circ(8 + Math.round(Math.cos(a * 1.26) * 3), 6 + Math.round(Math.sin(a * 1.26) * 3), 2, c); p.circ(8, 6, 1, ctr); p.line(8, 9, 8, 15, '#3a8a2a'); p.line(8, 12, 11, 10, '#3a8a2a'); },
  leek(p) { p.r(6, 8, 4, 7, '#f4f0e6'); p.poly([[6, 8], [10, 8], [13, 0], [10, 2], [8, 0], [5, 1]], '#4aaa3a'); },
  mushroom(p, [cap = '#c8a060', spots = null, stem = '#f0e8d8']) { p.r(6, 9, 4, 6, stem); p.ell(8, 7, 6, 4, cap); p.ell(6, 6, 2, 1, shade(cap, .3)); if (spots) { p.p(5, 6, spots); p.p(10, 5, spots); p.p(8, 8, spots); } },
  berry(p, [c = '#2a1a4a', leaf = '#3a8a2a']) { for (const [x, y] of [[6, 7], [10, 7], [8, 10], [6, 12], [10, 12]]) { p.circ(x, y, 2, c); p.p(x - 1, y - 1, shade(c, .5)); } p.line(8, 5, 10, 1, leaf); },
  grape(p) { for (const [x, y] of [[6, 5], [10, 5], [8, 8], [5, 9], [11, 9], [8, 12]]) { p.circ(x, y, 2, '#6a2a9a'); p.p(x - 1, y - 1, '#b080e0'); } p.vl(8, 1, 3, '#5a3a1a'); },
  crystal(p, [c = '#9ad0ff']) { p.poly([[8, 1], [13, 6], [8, 15], [3, 6]], c); p.line(8, 1, 8, 15, shade(c, .4)); p.line(3, 6, 13, 6, shade(c, -.2)); },
  holly(p) { p.poly([[2, 8], [7, 4], [8, 9]], '#2a7a2a'); p.poly([[14, 8], [9, 4], [8, 9]], '#2a7a2a'); p.circ(7, 11, 2, '#d02020'); p.circ(10, 11, 2, '#d02020'); },
  log(p, [c = '#8a5a30', end = '#c49a62']) { p.r(2, 6, 11, 7, c); p.hl(2, 12, 8, shade(c, -.2)); p.hl(2, 12, 11, shade(c, -.2)); p.ell(13, 9, 2, 3, end); p.p(13, 9, shade(end, -.3)); },
  stone(p, [c = '#8a8580']) { p.ell(8, 9, 6, 5, c); p.ell(7, 8, 4, 3, shade(c, .2)); p.p(5, 7, shade(c, .5)); p.line(9, 10, 12, 11, shade(c, -.3)); },
  fiber(p) { for (let k = 0; k < 5; k++) p.line(4 + k * 2, 15, 6 + k, 2 + (k % 2) * 2, k % 2 ? '#7aaa3a' : '#5a8a2a'); },
  ore(p, [c]) { p.ell(8, 9, 6, 5, '#6d6a70'); p.ell(7, 8, 4, 3, '#8d8a90'); for (const [x, y] of [[5, 7], [9, 9], [7, 11], [11, 7]]) { p.r(x, y, 2, 2, c); p.p(x, y, shade(c, .5)); } },
  bar(p, [c]) { p.poly([[2, 11], [5, 6], [14, 6], [11, 11]], c); p.poly([[2, 11], [11, 11], [11, 13], [2, 13]], shade(c, -.3)); p.poly([[11, 11], [14, 6], [14, 8], [11, 13]], shade(c, -.45)); p.line(5, 7, 12, 7, shade(c, .5)); },
  gem(p, [c]) { p.poly([[4, 6], [7, 3], [9, 3], [12, 6], [8, 14]], c); p.poly([[4, 6], [12, 6], [8, 14]], shade(c, -.2)); p.line(6, 4, 7, 6, shade(c, .6)); p.p(6, 5, '#fff'); },
  geode(p, [c = '#a0784a', inner = null]) { p.circ(8, 8, 6, c); p.speck(3, 3, 11, 11, [shade(c, -.3)], .2, 2); if (inner) { p.circ(8, 8, 3, inner); p.p(7, 7, '#fff'); } else p.line(5, 6, 10, 11, shade(c, -.5)); },
  slime(p) { p.ell(8, 10, 6, 4, '#5ac84a'); p.ell(6, 8, 2, 1, '#c8f8b8'); p.p(11, 13, '#5ac84a'); p.p(4, 14, '#5ac84a'); },
  bone(p) { p.line(4, 12, 12, 4, '#efe8dc'); p.line(5, 12, 12, 5, '#efe8dc'); p.circ(3, 12, 1, '#efe8dc'); p.circ(5, 14, 1, '#efe8dc'); p.circ(11, 3, 1, '#efe8dc'); p.circ(13, 5, 1, '#efe8dc'); },
  ecto(p) { p.ell(8, 8, 5, 6, '#c8f0ff', 200); p.p(6, 7, '#000'); p.p(10, 7, '#000'); for (let x = 3; x < 14; x += 3) p.p(x, 14, '#c8f0ff'); },
  essence(p, [c = '#6a3ad0']) { p.circ(8, 8, 5, shade(c, -.4)); p.circ(8, 8, 3, c); p.circ(7, 7, 1, '#fff'); p.ring(8, 8, 6, shade(c, .3)); },
  wing(p) { p.poly([[2, 4], [14, 8], [10, 14], [7, 10], [4, 12]], '#4a3a5a'); p.line(2, 4, 10, 12, '#7a6a8a'); },
  eyeball(p) { p.circ(8, 8, 5, '#f4ece4'); p.circ(9, 8, 2, '#3a8a5a'); p.p(9, 8, '#000'); p.line(3, 9, 5, 8, '#d03040'); p.line(9, 3, 8, 5, '#d03040'); },
  fish(p, [c = '#8a9aa0', c2 = '#c8d4dc', shape = 0]) {
    if (shape === 1) { p.ell(8, 8, 6, 2, c); p.poly([[1, 6], [3, 8], [1, 10]], c2); } // угорь/щука
    else if (shape === 2) { p.ell(8, 8, 5, 5, c); p.poly([[1, 5], [4, 8], [1, 11]], c2); p.poly([[6, 2], [10, 3], [8, 5]], c2); } // круглая
    else { p.ell(8, 8, 6, 4, c); p.poly([[0, 4], [3, 8], [0, 12]], c2); p.poly([[6, 3], [11, 3], [9, 5]], c2); }
    p.circ(12, 7, 1, '#fff'); p.p(12, 7, '#000'); p.line(5, 9, 10, 9, shade(c, .3)); p.p(14, 9, shade(c, -.4));
  },
  plate(p, [c = '#c87a3a', c2 = '#e0c060']) { p.ell(8, 11, 7, 3, '#f4f4f4'); p.ell(8, 11, 5, 2, '#d8d8d8'); p.ell(8, 8, 4, 3, c); p.ell(7, 7, 2, 1, c2); p.p(10, 8, shade(c, -.3)); },
  bowl(p, [c = '#c84a2a', c2 = '#f0d060']) { p.poly([[2, 8], [14, 8], [11, 14], [5, 14]], '#e8e8f0'); p.ell(8, 8, 6, 2, c); p.p(6, 8, c2); p.p(10, 7, c2); p.line(10, 2, 12, 5, '#ccc'); p.line(6, 3, 5, 6, '#ccc', 120); },
  cup(p, [c = '#7a3a1a']) { p.r(4, 6, 7, 8, '#f4f4f4'); p.r(5, 7, 5, 2, c); p.ring(12, 9, 2, '#f4f4f4'); p.ell(7, 14, 5, 1, '#d8d8d8'); p.line(6, 4, 7, 1, '#ccc', 140); p.line(9, 4, 8, 1, '#ccc', 140); },
  bottle(p, [c = '#7a1a3a', label = '#f0e0c0']) { p.r(6, 1, 4, 4, shade(c, -.3)); p.r(4, 5, 8, 10, c); p.r(5, 8, 6, 4, label); p.vl(5, 5, 14, shade(c, .4)); },
  jar(p, [c = '#d8a040']) { p.r(4, 4, 8, 11, '#cde4f0'); p.r(5, 7, 6, 7, c); p.r(4, 2, 8, 2, '#8a8a8a'); p.vl(5, 5, 13, '#fff'); },
  potion(p, [c = '#4af04a']) { p.r(7, 1, 2, 3, '#8a6a4a'); p.r(6, 4, 4, 2, '#cde4f0'); p.circ(8, 10, 4, '#cde4f0'); p.circ(8, 11, 3, c); p.p(6, 9, '#fff'); },
  pill(p) { p.poly([[3, 10], [9, 4], [12, 7], [6, 13]], '#f4f4f4'); p.poly([[9, 4], [12, 7], [10, 9], [7, 6]], '#d02030'); },
  page(p, [n = 0]) { p.poly([[3, 1], [12, 1], [14, 3], [14, 15], [3, 15]], '#f2efe6'); p.poly([[12, 1], [14, 3], [12, 3]], '#c8c4b8'); for (let y = 4; y < 14; y += 2) p.hl(5, 12, y, '#555'); p.p(10, 13, '#c00'); p.p(11, 14, '#c00'); },
  letter(p) { p.r(2, 4, 12, 9, '#f4ecd8'); p.line(2, 4, 8, 9, '#a08a60'); p.line(14, 4, 8, 9, '#a08a60'); p.circ(8, 9, 1, '#c02030'); },
  pendant(p) { p.ring(8, 6, 5, '#c9a24a'); p.circ(8, 12, 3, '#3ac8e0'); p.p(7, 11, '#fff'); },
  bouquet(p) { p.poly([[5, 9], [11, 9], [9, 15], [7, 15]], '#5a8a3a'); for (const [x, y, c] of [[5, 5, '#f28cc0'], [9, 3, '#f2e040'], [11, 6, '#f28cc0'], [7, 7, '#ffffff']]) p.circ(x, y, 2, c); p.hl(6, 10, 10, '#d02030'); },
  shorts(p) { p.poly([[3, 3], [13, 3], [14, 13], [9, 13], [8, 8], [7, 13], [2, 13]], '#7a3ac0'); p.hl(3, 13, 4, '#5a2a9a'); p.p(8, 5, '#f2c430'); },
  estus(p, [full = 1]) { p.r(7, 1, 2, 3, '#8a6a4a'); p.circ(8, 10, 5, '#d8c8a0'); p.circ(8, 10, 4, full ? '#ff8a20' : '#5a4a3a'); if (full) { p.circ(7, 9, 1, '#ffe080'); } p.ring(8, 10, 5, '#8a6a3a'); },
  bomb(p) { p.circ(8, 10, 5, '#2a2a2a'); p.p(6, 8, '#6a6a6a'); p.line(8, 5, 11, 2, '#8a6a3a'); p.p(12, 1, '#ff8020'); p.p(11, 1, '#ffe060'); },
  ring(p, [c = '#c9a24a', g = '#d02030']) { p.ring(8, 9, 4, c); p.ring(8, 9, 3, shade(c, -.2)); p.circ(8, 4, 2, g); },
  hat(p, [c = '#2a1a3a']) { p.ell(8, 12, 7, 2, c); p.r(4, 3, 8, 9, c); p.hl(4, 11, 9, '#d02030'); },
  crown(p) { p.poly([[2, 13], [14, 13], [14, 4], [11, 8], [8, 2], [5, 8], [2, 4]], '#f2c430'); p.p(8, 9, '#d02030'); },
  ball(p) { p.circ(8, 8, 6, '#f2c430'); p.circ(6, 6, 2, '#fff8c0'); p.ring(8, 8, 6, '#a07a10'); },
  shoe(p) { p.poly([[2, 8], [7, 8], [8, 11], [14, 12], [14, 14], [2, 14]], '#5a3a2a'); p.hl(2, 14, 14, '#2a1a10'); },
  weed(p) { p.line(4, 14, 3, 4, '#2a6a4a'); p.line(8, 14, 9, 2, '#3a8a5a'); p.line(12, 14, 13, 5, '#2a6a4a'); },

const CROPS = {
  parsnip: { item: 'parsnip', seasons: [0], days: 4, regrow: 0, look: 'root', col: '#f2e0a0' },
  garlic: { item: 'garlic', seasons: [0], days: 4, regrow: 0, look: 'root', col: '#f4f0e6' },

  melon: { item: 'melon', seasons: [1], days: 12, regrow: 0, look: 'big', col: '#7ac85a' },

  sunflower: { item: 'sunflower', seasons: [1, 2], days: 8, regrow: 0, look: 'tall', col: '#f2c430', seedBack: 1 },

  cranberry: { item: 'cranberry', seasons: [2], days: 7, regrow: 5, look: 'bush', col: '#a01020', multi: 2 },

  mandrake: { item: 'mandrake', seasons: [0, 1, 2], days: 10, regrow: 0, look: 'root', col: '#c8a070', scream: true },
  blackseed: { item: 'blackfruit', seasons: [0, 1, 2, 3], days: 14, regrow: 0, look: 'black', col: '#0a0a0e' },
};
function cropStage(soil) { const c = CROPS[soil.crop]; if (!c) return 0; if (soil.age >= c.days) return 4; return Math.min(3, Math.floor(soil.age / c.days * 4)); }
function cropSprite(id, stage, creepy) {
  return spr(`crop:${id}:${stage}:${creepy ? 1 : 0}`, () => {
    const C = CROPS[id]; const p = new PX(16, 24); const g = '#4a9a3a', gd = '#2f6e22', gl = '#7ac458';
    const base = 23;
    if (stage === 0) { p.p(7, base - 1, gl); p.p(9, base - 1, gl); p.p(8, base, g); p.p(6, base - 2, g); p.p(10, base - 2, g); }
    else if (C.look === 'black') {
      const h = 4 + stage * 4;
      p.line(8, base, 8, base - h, '#1a1018'); p.line(8, base - h / 2, 4, base - h / 2 - 3, '#1a1018'); p.line(8, base - h / 3, 12, base - h / 3 - 4, '#1a1018');
      if (stage >= 2) { p.ell(5, base - h / 2 - 4, 2, 1, '#3a1a3a'); p.ell(12, base - h / 3 - 5, 2, 1, '#3a1a3a'); }
      if (stage === 4) { p.circ(8, base - h - 2, 4, '#0a0a0e'); p.ring(8, base - h - 2, 5, '#6a2a9a'); p.ell(8, base - h - 2, 2, 1, '#f0f0f0'); p.p(8, base - h - 2, '#d02030'); }
      else if (stage === 3) { p.circ(8, base - h - 1, 2, '#2a1a2a'); }
    } else if (C.look === 'root') {
      const n = stage + 1;
      for (let k = 0; k < n + 1; k++) { const x = 5 + k * (6 / Math.max(1, n)); p.line(8, base, x, base - 3 - stage * 2 - (k % 2), k % 2 ? g : gl); }
      if (stage >= 3) p.line(8, base, 8, base - 9, gd);
      if (stage === 4) { p.ell(8, base - 1, 3, 2, C.col); p.p(7, base - 2, shade(C.col, .4)); if (creepy) { p.p(7, base - 1, '#000'); p.p(9, base - 1, '#000'); } }
    } else if (C.look === 'bush') {
      const r = 2 + stage; p.vl(8, base - r * 2, base, gd);
      p.circ(8, base - r - 1, r, g); p.circ(6, base - r - 2, Math.max(1, r - 2), gl); p.circ(10, base - r, Math.max(1, r - 1), gd);
      if (stage === 4) { for (const [x, y] of [[5, -8], [10, -6], [7, -4], [11, -10], [6, -11]]) { p.circ(x, base + y, 1, C.col); p.p(x - 1, base + y - 1, shade(C.col, .5)); if (creepy && x === 7) { p.p(x, base + y, '#000'); } } }
      else if (stage === 3) { p.p(6, base - 8, '#fff'); p.p(10, base - 6, '#fff'); }
    } else if (C.look === 'big') {
      const r = 2 + stage;
      p.ell(5, base - 3, r, 2, g); p.ell(11, base - 3, r, 2, gd); p.line(8, base, 8, base - 3 - stage * 2, gd); p.ell(8, base - 5 - stage, 2, 1 + stage / 2, gl);
      if (stage === 4) {
        p.ell(8, base - 6, 6, 5, C.col); p.ell(6, base - 8, 2, 2, shade(C.col, .35)); p.ell(8, base - 6, 6, 5, null);
        if (id === 'cauli') { p.line(8, base - 11, 8, base - 2, shade(C.col, -.3)); p.line(4, base - 7, 7, base - 6, shade(C.col, -.3)); p.line(9, base - 8, 12, base - 6, shade(C.col, -.3)); }
        if (id === 'pumpkin' || creepy) { p.p(6, base - 7, '#2a0a00'); p.p(10, base - 7, '#2a0a00'); p.hl(6, 10, base - 4, '#2a0a00'); }
        if (id === 'melon') { p.r(5, base - 8, 2, 2, '#1a3a1a'); p.r(9, base - 8, 2, 2, '#1a3a1a'); p.hl(6, 10, base - 4, '#1a3a1a'); }
      }
    } else if (C.look === 'tall') {
      const h = 4 + stage * 4; p.line(8, base, 8, base - h, gd); p.ell(5, base - h / 2, 2, 1, g); p.ell(11, base - h / 2 - 2, 2, 1, g);
      if (stage === 4) { for (let a = 0; a < 8; a++) p.circ(8 + Math.round(Math.cos(a) * 3), base - h - 2 + Math.round(Math.sin(a) * 3), 1, C.col); p.circ(8, base - h - 2, 2, '#5a3a1a'); p.p(7, base - h - 3, '#fff'); p.p(9, base - h - 3, '#fff'); p.p(7, base - h - 2, '#000'); p.p(9, base - h - 2, '#000'); }
    }
    p.outline('#14200f');
    return p.done();
  });
}

  'Глава III. Ведьма.\n\nЛилит должна была сгореть в третьей главе. Но она сбежала со страниц. Я до сих пор её ищу. Передай ей, что я не сержусь. Почти.',
  'Глава IV. Утопленница.\n\nОфелию я столкнула в колодец сама. Чернила текли по её щекам. Я плакала вместе с ней. Это был мой лучший абзац.',

  'Глава VI. Жмуримо.\n\nМаленькие души тех, кого я вычеркнула. Ты {накормил|накормила} их. Они помнят. Они откроют тебе дверь.',
  'Глава VII. Автор.\n\nЯ — Мэри Сью. Я пишу этот мир, потому что в своём мне было одиноко. Ты — мой лучший персонаж. Не уходи из моей книги. Пожалуйста.',
];

const Events = {
  /* ---------- вступление ---------- */

    await UI.fade(true); World.enter('farm', 8, 7, 'down', true); await UI.fade(false);

    await say('mayor', 'А! Вот и вы! Наследник фермы «Чёрная Почва»! Я мэр Гнилушкин. Добро пожаловать в Шепчущую Лощину!', 'happy');
    await say('mayor', 'Ферма немного... заросла. После того как ваш дед... э-э... ушёл на покой. Вечный. В основном.', 'neutral');

    await say('mayor', 'Деревня на востоке. Лес — на юге. А колодец... какой колодец? Нет у вас никакого колодца. Ха-ха. Всего доброго!', 'neutral');

    Game.unlock();
    UI.note(Input.touch ? 'Джойстик — ходить. Большая кнопка — инструмент. Рука — взаимодействие.' : 'WASD — ходить, Пробел/J — инструмент, E/K — взаимодействие, Shift — кувырок, I — меню.');
  },

  /* ---------- вход в карту ---------- */
  onEnter(m) {
    if (m.theme === 'dungeon') {
      if (m.depth === 1 && !S.flags.well1) { S.flags.well1 = 1; setTimeout(() => narr('Ступени скользкие. Внизу пахнет землёй, железом и старой бумагой. Кто-то вёл здесь записи.'), 500); }
      if (m.depth === 5 && !S.flags.well5note) { S.flags.well5note = 1; setTimeout(() => UI.note('Костёр! Отдохни у него: здоровье, эстус и рассудок. Тут же можно повысить уровень за души.', 'good'), 800); }
      if (m.depth === 30 && !S.flags.lib) { S.flags.lib = 1; setTimeout(() => this.libraryEnter(), 600); }
      if (m.boss && m.bossPending && !S.flags['bossseen' + m.depth]) { S.flags['bossseen' + m.depth] = 1; setTimeout(() => UI.note('Впереди туманная стена. За ней — что-то большое. Подойди и коснись тумана.', 'bad'), 700); }
      return;
    }
    if (m.id === 'village' && !S.flags.villageTip) { S.flags.villageTip = 1; setTimeout(() => UI.note('Шепчущая Лощина. Поговори с жителями — у каждого над головой знак, пока ты не поговорил{|а} сегодня.'), 600); }
    if (m.id === 'chapel' && !S.flags.chapelSeen) { setTimeout(() => this.chapelFirst(), 400); return; }
    this.checkHeart(m);
  },
  checkHeart(m) {
    if (Game.locked()) return;
    for (const ev of HEART_EVENTS) {
      if (S.flags['ev_' + ev.id] || ev.map !== m.id) continue;
      if (hearts(ev.npc) < ev.h) continue;
      const t = hhmm(); if (ev.time && (t < ev.time[0] || t > ev.time[1])) continue;
      if (ev.cond && !ev.cond()) continue;
      if (!m.npcs.some(n => n.id === ev.npc) && !ev.noNpc) continue;
      S.flags['ev_' + ev.id] = 1;
      setTimeout(async () => { Game.lock(); try { await ev.fn(m); } finally { Game.unlock(); } }, 350);
      break;
    }
  },
  tick(m) {
    if (m.theme !== 'dungeon') this.checkHeart(m);
    // голос из колодца
    if (!S.flags.wellOpen && S.absDay >= 2 && m.id === 'farm' && S.time >= 1230) { S.flags.wellOpen = true; this.wellVoice(); return; }
    if (Fest.today() === 'eyes' && S.time === 1020 && m.id === 'village') UI.note('Праздник Глаз: отнеси найденное мэру до полуночи!', 'good');
    if (S.time === 1320 && m.outdoor && S.sanity < 40 && Math.random() < .3) this.marySighting();
    if (Fest.today() === 'spirits' && m.id === 'village' && S.time >= 1320 && !S.flags['spirits' + S.year]) { S.flags['spirits' + S.year] = 1; this.spiritsNight(); }
  },
  async wellVoice() {
    Game.lock();
    AU.sfx('whisper'); await U.sleep(400);
    await narr('Из колодца доносится женский голос. Тихий. Мокрый.');
    await UI.say('ophelia', T('...эй. Ты... слышишь меня? Наконец-то кто-то живой. Спустись. Пожалуйста. Здесь так темно, и столько страниц...'), 'sad');
    const c = await choose('Ответить голосу?', ['Ответить', 'Промолчать', 'Убить'], 2);
    if (c === 0) { await say('ophelia', 'Ты ответил{|а}! Твой дед тоже отвечал. Сначала. Приходи ночью — я поднимусь к краю. А внизу... внизу тебя ждёт она.', 'blush'); S.flags.metOphelia = true; rel('ophelia').met = true; Social.addPts('ophelia', 60); }
    else if (c === 1) { await narr('Ты молчишь. Голос смеётся — тихо, как вода в трубах. «Дед тоже сначала молчал».'); }
    else { await this.killFlash(); await narr('Ты швыряешь в колодец камень. Снизу — плеск. Потом тишина. Потом смех. Ты не можешь убить то, что уже утонуло.'); S.sin++; Sanity.add(-5); }
    Quests.start('q_well');
    UI.note('Колодец открыт. Подойди к нему и нажми «взаимодействие».', 'good');
    Game.unlock();
  },
  async spiritsNight() {
    Game.lock(); AU.sfx('whisper'); Music.play('library');
    await narr('Ночь Духов. Фонари на площади гаснут один за другим. У фонтана стоит девушка в чёрном платье и что-то пишет в воздухе огромным пером.');
    await UI.say('marysue', T('О, @. Ты пришёл{|ла} на праздник. Знаешь, в эту ночь граница между страницами тоньше всего. Я могу выйти. Совсем ненадолго.'), 'happy');
    await UI.say('marysue', T(S.pages.length >= 4 ? 'Ты собрал{|а} уже ' + S.pages.length + ' моих страниц. Ты ведь понимаешь, что читаешь мой дневник? Это неприлично. Мне нравится.' : 'Ты ещё так мало обо мне знаешь. Спускайся глубже. Я оставила тебе страницы, как хлебные крошки.'), 'neutral');
    const c = await choose('', ['Кто ты?', 'Отпусти Лощину', 'Убить'], 2);
    if (c === 0) await UI.say('marysue', 'Я та, кто пишет. А ты — тот, кого читают. Пока что.', 'wink');
    else if (c === 1) await UI.say('marysue', 'Отпустить? А куда они пойдут? Их нет за пределами моей книги. Как и тебя, милый персонаж.', 'sad');
    else { await this.killFlash(); await UI.say('marysue', 'Ха-ха-ха! Ты не можешь убить автора на его же странице. Но попытка засчитана. Мне понравилось.', 'creepy'); S.sin++; }
    await narr('Она растворяется в чернилах. Фонари загораются вновь. На брусчатке остаётся клякса в форме сердца.');
    Inv.give('ink', 3); Sanity.add(-5);
    Music.play(Game.musicFor(World.cur)); Game.unlock();
  },
  async marySighting() {
    AU.sfx('glitch'); Halluc.overlay = { t: 1.5, txt: 'М.С.' };
    UI.note('На краю зрения — девушка в чёрном платье с огромным пером. Моргнёшь — её нет.', 'bad');
  },
  /* ---------- предметы ---------- */
  async readBottle(st) {
    const i = S.inv.indexOf(st); Inv.takeAt(i, 1);
    const n = st.of === 'grandpa' ? -1 : (parseInt((st.of || 'r0').slice(1)) || 0) % NOTES.length;
    if (n === -1) { await UI.letter('Записка деда, найденная в бутылке:\n\n«{Внучок|Внучка}. Если читаешь — значит, я оказался прав и ты приехал{|а}. Земля тут хорошая, жирная, чёрная. Слишком чёрная. Я посадил одно семя — и вырос колодец. Не повторяй.\n\nP.S. В сундуке есть подарки. Чёрное — не трогай. Пастернак — трогай.»'); return; }
    await UI.letter(NOTES[n]);
  },
  async grandpaChest(o) {
    Game.lock(); S.flags.grandpaChest = true;
    await narr('Сундук деда. На крышке нацарапано: «НЕ ОТКРЫВАЙ». Ниже, другим почерком: «Открой».');

  },
  async blackFruit() {
    Game.lock(); AU.sfx('heartbeat');
    await narr('Чёрный плод. Тяжёлый, тёплый. Внутри что-то скребётся — как перо по бумаге.');
    await narr('На кожуре проступают буквы: «Дверь Автора. Этаж 30. Семь страниц».');
