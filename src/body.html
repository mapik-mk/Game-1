<div id="app">
  <canvas id="cv"></canvas>
  <div id="vignette"></div>
  <div id="hud" hidden>
    <div id="hud-left">
      <div class="bar" id="bar-hp"><img id="ic-hp" alt="Здоровье"><span><i></i></span></div>
      <div class="bar" id="bar-en"><img id="ic-en" alt="Энергия"><span><i></i></span></div>
      <div class="bar" id="bar-sn"><img id="ic-sn" alt="Рассудок"><span><i></i></span></div>
      <div id="souls"><span><img id="ic-soul" alt=""><b id="v-souls">0</b></span><span><img id="ic-estus" alt=""><b id="v-estus">3/3</b></span></div>
    </div>
    <div id="hud-right">
      <div id="clock" class="frame">
        <div id="c-date"></div>
        <div id="c-time"></div>
        <div id="c-gold"><img id="ic-gold" alt=""><span id="v-gold"></span></div>
      </div>
      <button id="b-menu" aria-label="Меню">≡</button>
    </div>
    <div id="locname"></div>
    <div id="notes"></div>
    <div id="toolbar"></div>
  </div>
  <div id="touch" hidden>
    <div id="joyzone"><div id="joybase"><div id="joyknob"></div></div></div>
    <div id="tbtns">
      <button id="b-roll" class="tb small" aria-label="Кувырок"><img id="b-roll-ico" alt=""></button>
      <button id="b-act" class="tb" aria-label="Взаимодействие"><img id="b-act-ico" alt=""></button>
      <button id="b-use" class="tb big" aria-label="Использовать"><img id="b-use-ico" alt=""></button>
    </div>
  </div>
  <div id="dlg" class="frame" hidden>
    <div id="dlg-por"><canvas id="dlg-cv" width="128" height="128"></canvas></div>
    <div id="dlg-body">
      <div id="dlg-name"></div>
      <div id="dlg-text"></div>
      <div id="dlg-choices"></div>
    </div>
    <div id="dlg-next">▼</div>
  </div>
  <div id="panel" hidden></div>
  <div id="screen" hidden></div>
  <div id="fade"></div>
</div>
