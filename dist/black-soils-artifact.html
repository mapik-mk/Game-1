/* Layout: полноэкранный мир; часы справа сверху, шкалы справа снизу, панель предметов по центру снизу.
   Интерфейс — пиксельные рамки как в Stardew Valley: оранжевое дерево, пергамент, тёмно-коричневый текст с бежевой тенью.
   При потере рассудка интерфейс выцветает (Black Souls). */
:root{
  --ink:#0e0b0d; --ink-2:#1d1619;
  --paper:#ffdea0; --paper-2:#f8c77e; --paper-3:#e3a35c; --paper-hi:#fff3d0;
  --wood:#dd7d26; --wood-d:#3e1708; --wood-l:#f7a845; --wood-ll:#ffd27a; --wood-dd:#7a3410;
  --tx:#56160c; --tx-2:#7a3a18; --tx-sh:#ce9c5f; --tx-l:#fff2d8;
  --blood:#c2142e; --blood-d:#6a0816; --moss:#4f8f2c; --moss-l:#79ad44; --gold:#f7c948; --gold-d:#8a4a00; --violet:#9a63e0;
  --text:var(--tx); --text-2:var(--tx-2); --text-l:#f7ecd4;
  --f-ui:'Nunito',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  --f-title:'Rubik Wet Paint','Nunito',Impact,serif;
  --f-hand:'Neucha','Segoe Print','Comic Sans MS',cursive;
  --px:3px; --gs:0;
  color-scheme:dark;
}
@media (max-width:700px),(max-height:520px){:root{--px:2px;}}
[hidden]{display:none!important;}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text-l);overflow:hidden;overscroll-behavior:none;}
body{min-height:100vh;font-family:var(--f-ui);font-weight:700;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
#app{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);overflow:hidden;background:var(--ink);}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;}
#vignette{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(120,0,20,.55) 100%);}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:20;}
#fade.on{opacity:1;pointer-events:all;}
button{font-family:var(--f-ui);font-weight:800;cursor:pointer;color:inherit;}
button:focus-visible{outline:3px solid #fff;outline-offset:2px;}
img.px{image-rendering:pixelated;}

/* ---------- экран загрузки ---------- */
#boot{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--ink);color:#e8dcc8;text-align:center;padding:16px;box-sizing:border-box;}
#boot b{font-family:var(--f-title);font-size:34px;color:#f3efe8;text-shadow:3px 3px 0 var(--blood-d);font-weight:400;}
#boot i{display:block;width:150px;height:10px;border:2px solid #6b4a2a;border-radius:3px;overflow:hidden;background:#1a1012;}
#boot i::after{content:'';display:block;height:100%;width:40%;background:linear-gradient(90deg,#c2142e,#ff6a4a);animation:bootbar 1s ease-in-out infinite alternate;}
@keyframes bootbar{to{margin-left:60%}}
#boot p{margin:0;font-size:14px;max-width:34ch;line-height:1.4;color:#cbb;}
#boot pre{white-space:pre-wrap;font-size:12px;color:#ff9aa8;max-width:90vw;margin:0;}

/* ---------- пиксельные рамки ---------- */
.fr-box,.frame,.win,.summary,#dlg,#toolbar,#clock{border-style:solid;border-width:calc(var(--px)*6);border-color:var(--wood);
  border-image-source:var(--fr-box);border-image-slice:var(--fs-box) fill;border-image-repeat:round;image-rendering:pixelated;
  background:var(--paper);background-clip:padding-box;color:var(--tx);box-sizing:border-box;
  filter:drop-shadow(0 var(--px) 0 rgba(0,0,0,.35)) grayscale(var(--gs));}
.fr-plate{border-style:solid;border-width:calc(var(--px)*3);border-color:var(--paper-3);border-image-source:var(--fr-plate);border-image-slice:var(--fs-plate) fill;border-image-repeat:round;image-rendering:pixelated;background:var(--paper-hi);background-clip:padding-box;}
.fr-inset,.info,.li,.bundle,.sk-row{border-style:solid;border-width:calc(var(--px)*3);border-color:var(--paper-3);border-image-source:var(--fr-inset);border-image-slice:var(--fs-inset) fill;border-image-repeat:round;image-rendering:pixelated;background:#fff0c8;background-clip:padding-box;}
.txt{color:var(--tx);text-shadow:calc(var(--px)*-.6) calc(var(--px)*.6) 0 var(--tx-sh);}

/* ---------- кнопки ---------- */
.btn,.fr-btn,#b-menu,.win-h .x,#dlg-choices button,.tabs button{border-style:solid;image-rendering:pixelated;background-clip:padding-box;box-sizing:border-box;}
.btn,.fr-btn,#b-menu{border-width:calc(var(--px)*4);border-color:var(--wood);border-image-source:var(--fr-btn);border-image-slice:var(--fs-btn) fill;border-image-repeat:round;background:var(--wood);
  color:var(--tx-l);text-shadow:calc(var(--px)*-.6) calc(var(--px)*.6) 0 var(--wood-dd);padding:4px 10px;font-size:16px;font-weight:900;letter-spacing:.01em;
  filter:drop-shadow(0 var(--px) 0 rgba(0,0,0,.35));}
.btn:active,.fr-btn:active,#b-menu:active{transform:translateY(var(--px));filter:none;}
.btn:disabled{filter:grayscale(.7) opacity(.55);}
.btn.red,.win-h .x{border-image-source:var(--fr-btnr);border-image-slice:var(--fs-btnr) fill;border-color:#c21c2a;background:#d8303a;}
.btn.green{border-image-source:var(--fr-btng);border-image-slice:var(--fs-btng) fill;border-color:#5c9a28;background:#73b236;text-shadow:calc(var(--px)*-.6) calc(var(--px)*.6) 0 #2f5e12;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;}
#hud-right{position:absolute;right:8px;top:8px;display:flex;gap:6px;align-items:flex-start;}
#clock{min-width:150px;padding:2px 6px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;}
#c-date{font-size:14px;font-weight:900;color:var(--tx);text-shadow:-1px 1px 0 var(--tx-sh);white-space:nowrap;}
#c-mid{display:flex;align-items:center;justify-content:space-between;gap:6px;}
#c-dial{width:calc(var(--px)*14);height:calc(var(--px)*8);image-rendering:pixelated;flex:0 0 auto;}
#c-time{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--tx);text-shadow:-1px 2px 0 var(--tx-sh);white-space:nowrap;}
#c-gold{display:flex;justify-content:flex-end;align-items:center;gap:5px;padding:0 6px;font-size:16px;font-weight:900;color:#a8320c;font-variant-numeric:tabular-nums;text-shadow:-1px 1px 0 #f8c77e;}
#c-gold img,#souls img{width:16px;height:16px;image-rendering:pixelated;}
#souls{display:flex;justify-content:space-between;gap:8px;padding:0 2px;font-size:13px;font-weight:900;color:#2a5a8a;font-variant-numeric:tabular-nums;}
#souls span{display:flex;align-items:center;gap:3px;}
#b-menu{pointer-events:auto;width:calc(var(--px)*8 + 34px);height:calc(var(--px)*8 + 34px);font-size:24px;line-height:1;padding:0;}
#bars{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;align-items:flex-end;pointer-events:none;filter:grayscale(var(--gs));}
.vbar{display:flex;flex-direction:column;align-items:center;gap:2px;}
.vbar img{width:20px;height:20px;image-rendering:pixelated;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6));}
.vbar span{display:block;position:relative;width:calc(var(--px)*6 + 8px);height:min(150px,22vh);box-sizing:border-box;border-style:solid;border-width:calc(var(--px)*3);
  border-image-source:var(--fr-bar);border-image-slice:var(--fs-bar) fill;border-image-repeat:round;image-rendering:pixelated;background:#3a1c10;background-clip:padding-box;}
.vbar i{position:absolute;left:0;right:0;bottom:0;height:50%;transition:height .25s;}
.vbar i::after{content:'';position:absolute;left:1px;width:2px;top:1px;bottom:1px;background:rgba(255,255,255,.4);}
#bar-hp i{background:linear-gradient(90deg,#ff7070,#e02a3a 40%,#a8101e);}
#bar-en i{background:linear-gradient(90deg,#d8f070,#7cc23a 40%,#4a8a1a);}
#bar-en.mid i{background:linear-gradient(90deg,#fff07a,#f0c02a 40%,#b8800a);}
#bar-en.low i{background:linear-gradient(90deg,#ff9a6a,#e0502a 40%,#a0300a);}
#bar-sn i{background:linear-gradient(90deg,#e0c0ff,#9a63e0 40%,#5b2aa6);}
#bar-sn.low i{background:linear-gradient(90deg,#ff6a80,#c2142e 40%,#5a0010);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.5}}
#app.touchmode #bars{bottom:calc(var(--tb-h,56px) + 186px);right:8px;}
#locname{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--f-title);font-size:24px;color:#fff3dc;
  text-shadow:0 3px 0 #3e1708,0 0 10px rgba(0,0,0,.9);opacity:0;transition:opacity .6s;white-space:nowrap;letter-spacing:.03em;}
#locname.on{opacity:1;}
#notes{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;max-width:min(58%,380px);pointer-events:none;}
.note{display:flex;align-items:center;gap:8px;padding:2px 6px;font-size:14px;font-weight:800;line-height:1.3;color:var(--tx);text-shadow:-1px 1px 0 var(--tx-sh);
  border-style:solid;border-width:calc(var(--px)*3);border-image-source:var(--fr-plate);border-image-slice:var(--fs-plate) fill;border-image-repeat:round;image-rendering:pixelated;background:var(--paper-hi);background-clip:padding-box;
  animation:noteIn .25s ease-out;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35));}
.note img{width:24px;height:24px;image-rendering:pixelated;flex:0 0 auto;}
.note.bad{color:#9a0a1a;}

  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } },
};

/* ---------- ввод: клавиатура + сенсор ---------- */
const Input = {
  down: {}, hit: {}, joy: { x: 0, y: 0, on: false }, touch: false, lastHitTime: {},
  keymap: {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'use', KeyJ: 'use', KeyC: 'use', KeyE: 'act', KeyK: 'act', Enter: 'act', KeyX: 'act', KeyF: 'act',
    ShiftLeft: 'roll', ShiftRight: 'roll', KeyL: 'roll', KeyI: 'menu', Tab: 'menu', Escape: 'esc', KeyQ: 'prev', KeyR: 'next',
    Digit1: 's0', Digit2: 's1', Digit3: 's2', Digit4: 's3', Digit5: 's4', Digit6: 's5', Digit7: 's6', Digit8: 's7', Digit9: 's8', Digit0: 's9', Minus: 's10', Equal: 's11',
  },
  press(a) { if (!this.down[a]) this.hit[a] = true; this.down[a] = true; },
  release(a) { this.down[a] = false; },
  endFrame() { this.hit = {}; },
  clear() { this.down = {}; this.hit = {}; this.joy.x = this.joy.y = 0; },
  axis() {
    let x = 0, y = 0;
    if (this.down.left) x -= 1; if (this.down.right) x += 1; if (this.down.up) y -= 1; if (this.down.down) y += 1;
    x += this.joy.x; y += this.joy.y;
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    return { x, y };
  },
  init() {
    addEventListener('keydown', e => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      const a = this.keymap[e.code]; if (!a) return;
      e.preventDefault(); this.press(a); AU.unlock();
    });
    addEventListener('keyup', e => { const a = this.keymap[e.code]; if (a) this.release(a); });
    addEventListener('blur', () => this.clear());
    this.touch = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
    // джойстик
    const zone = $('#joyzone'), base = $('#joybase'), knob = $('#joyknob');
    let jid = null, bx = 0, by = 0;
    const R = 46;
    const setKnob = (dx, dy) => { knob.style.transform = `translate(${dx}px,${dy}px)`; };
    const start = (id, cx, cy) => {
      jid = id; const r = zone.getBoundingClientRect(); bx = cx; by = cy;
      base.style.left = (cx - r.left) + 'px'; base.style.top = (cy - r.top) + 'px'; base.style.opacity = '1'; setKnob(0, 0); this.joy.on = true;
    };
    const move = (cx, cy) => {
      let dx = cx - bx, dy = cy - by; const l = Math.hypot(dx, dy);
      if (l > R) { dx = dx / l * R; dy = dy / l * R; }
      setKnob(dx, dy);
      const m = Math.hypot(dx, dy) / R;
      if (m < 0.18) { this.joy.x = this.joy.y = 0; } else { this.joy.x = dx / R; this.joy.y = dy / R; }
    };
    const end = () => { jid = null; this.joy.x = this.joy.y = 0; this.joy.on = false; setKnob(0, 0); base.style.opacity = '.55'; };
    zone.addEventListener('touchstart', e => { e.preventDefault(); AU.unlock(); const t = e.changedTouches[0]; if (jid === null) start(t.identifier, t.clientX, t.clientY); }, { passive: false });
    zone.addEventListener('touchmove', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === jid) move(t.clientX, t.clientY); }, { passive: false });
    const tend = e => { for (const t of e.changedTouches) if (t.identifier === jid) end(); };
    zone.addEventListener('touchend', tend); zone.addEventListener('touchcancel', tend);
    // мышь для теста
    let md = false;
    zone.addEventListener('mousedown', e => { md = true; start('m', e.clientX, e.clientY); });
    addEventListener('mousemove', e => { if (md) move(e.clientX, e.clientY); });
    addEventListener('mouseup', () => { if (md) { md = false; end(); } });
    // кнопки
    const bind = (id, act) => {
      const b = $(id);
      const on = e => { e.preventDefault(); AU.unlock(); this.press(act); b.classList.add('on'); };
      const off = e => { e.preventDefault(); this.release(act); b.classList.remove('on'); };
      b.addEventListener('touchstart', on, { passive: false }); b.addEventListener('touchend', off, { passive: false }); b.addEventListener('touchcancel', off);
      b.addEventListener('mousedown', on); b.addEventListener('mouseup', off); b.addEventListener('mouseleave', e => { if (this.down[act]) off(e); });
    };
    bind('#b-use', 'use'); bind('#b-act', 'act'); bind('#b-roll', 'roll');
    $('#b-menu').addEventListener('click', () => { AU.unlock(); this.hit.menu = true; });
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
  },
};

const Music = {
  cur: null, next: null, step: 0, t0: 0, timer: null, nextTime: 0,
  tracks: {
    title: { bpm: 72, root: 57, scale: [0, 2, 3, 5, 7, 8, 11], seed: 13, inst: 'box', bass: true, len: 32, density: .55 },
    day: { bpm: 112, root: 60, scale: [0, 2, 4, 7, 9], seed: 7, inst: 'pluck', bass: true, len: 32, density: .7 },
    town: { bpm: 104, root: 62, scale: [0, 2, 4, 5, 7, 9, 11], seed: 21, inst: 'pluck', bass: true, len: 32, density: .65 },
    night: { bpm: 70, root: 57, scale: [0, 2, 3, 7, 8], seed: 5, inst: 'box', bass: true, len: 32, density: .4 },
    indoor: { bpm: 90, root: 60, scale: [0, 4, 7, 9, 11], seed: 3, inst: 'box', bass: false, len: 16, density: .5 },
    dungeon: { bpm: 84, root: 45, scale: [0, 1, 3, 5, 7, 8, 10], seed: 9, inst: 'saw', bass: true, len: 32, density: .35, drone: true },
    boss: { bpm: 150, root: 45, scale: [0, 1, 3, 6, 7, 8, 11], seed: 66, inst: 'saw', bass: true, len: 32, density: .8, drone: true, drums: true },
    forest: { bpm: 96, root: 55, scale: [0, 2, 3, 5, 7, 10], seed: 31, inst: 'pluck', bass: true, len: 32, density: .5 },
    library: { bpm: 60, root: 52, scale: [0, 1, 4, 5, 7, 8, 11], seed: 404, inst: 'box', bass: true, len: 32, density: .45, drone: true },
    ending: { bpm: 66, root: 60, scale: [0, 2, 4, 5, 7, 9, 11], seed: 99, inst: 'box', bass: true, len: 32, density: .5 },
    silence: null,
  },
  gen(tr) {
    const r = RNG(tr.seed); const mel = [], bas = [];
    let deg = 4;
    for (let i = 0; i < tr.len; i++) {
      if (r() < tr.density || i % 8 === 0) { deg += Math.floor(r() * 5) - 2; deg = U.clamp(deg, 0, tr.scale.length * 2 - 1); mel.push(deg); } else mel.push(null);
      bas.push(i % 4 === 0 ? (Math.floor(i / 8) % 2 === 0 ? 0 : (r() < .5 ? 3 : 4)) : null);
    }
    // вторая половина — вариация первой
    for (let i = tr.len / 2; i < tr.len; i++) if (r() < .5) mel[i] = mel[i - tr.len / 2];
    tr._mel = mel; tr._bas = bas;
  },
  play(name) {
    if (this.cur === name) return;
    this.cur = name; this.step = 0;
    if (AU.ok) this.nextTime = AU.ctx.currentTime + 0.1;
  },
  start() {
    if (this.timer) return;
    this.nextTime = AU.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.tick(), 60);
  },
  freq(tr, deg, oct = 0) {
    const n = tr.scale.length; const o = Math.floor(deg / n); const s = tr.scale[((deg % n) + n) % n];
    return 440 * Math.pow(2, (tr.root + s + 12 * (o + oct) - 69) / 12);
  },
  tick() {
    if (!AU.ok || !this.cur) return;
    const tr = this.tracks[this.cur]; if (!tr) return;
    if (!tr._mel) this.gen(tr);
    const ctx = AU.ctx; const spb = 60 / tr.bpm / 2;
    const san = (typeof S !== 'undefined' && S && S.sanity !== undefined) ? S.sanity / Math.max(1, S.maxSanity) : 1;
    const insane = U.clamp((0.45 - san) / 0.45, 0, 1);
    while (this.nextTime < ctx.currentTime + 0.25) {
      const i = this.step % tr.len; const delay = Math.max(0, this.nextTime - ctx.currentTime);
      const det = insane > 0 ? (Math.random() - .5) * 120 * insane : 0;
      const m = tr._mel[i];
      if (m !== null && !(insane > .5 && Math.random() < insane * .35)) {
        const f = this.freq(tr, m, 0);
        if (tr.inst === 'box') { AU.tone(f * 2, spb * 3, 'sine', 0.07, 0, delay, AU.musG, det); AU.tone(f * 4, spb * 1.2, 'sine', 0.02, 0, delay, AU.musG, det); }
        else if (tr.inst === 'pluck') { AU.tone(f, spb * 1.6, 'triangle', 0.08, 0, delay, AU.musG, det); AU.tone(f * 2, spb * .6, 'square', 0.015, 0, delay, AU.musG, det); }
        else AU.tone(f, spb * 2, 'sawtooth', 0.025, 0, delay, AU.musG, det);
      }
      const b = tr._bas[i];
      if (tr.bass && b !== null) AU.tone(this.freq(tr, b, -2), spb * 3.5, 'triangle', 0.09, 0, delay, AU.musG, det * .5);
      if (tr.drone && i % 16 === 0) { AU.tone(this.freq(tr, 0, -2), spb * 16, 'sawtooth', 0.02, 0, delay, AU.musG, 7); AU.tone(this.freq(tr, 0, -2), spb * 16, 'sawtooth', 0.02, 0, delay, AU.musG, -9); }
      if (tr.drums) { if (i % 4 === 0) AU.tone(70, 0.15, 'sine', 0.25, -40, delay, AU.musG); if (i % 4 === 2) { AU.noise(0.06, 0.06, 6000, delay, 1, 'highpass'); } }
      if (insane > .6 && i % 8 === 0) { AU.tone(55, 0.12, 'sine', 0.2 * insane, -10, delay, AU.musG); AU.tone(50, 0.14, 'sine', 0.18 * insane, -10, delay + 0.22, AU.musG); }
      this.nextTime += spb; this.step++;

  },

/* ---------- текст с родом: "{устал|устала}", @ — имя ---------- */
function T(s) {
  if (!s) return '';
  const fem = typeof S !== 'undefined' && S && S.gender === 'f';
  return s.replace(/\{([^|{}]*)\|([^|{}]*)\}/g, (m, a, b) => fem ? b : a).replace(/@/g, (typeof S !== 'undefined' && S && S.name) || 'Фермер');
}
function glitchText(s, amt) {
  if (amt <= 0) return s;
  const g = '▓▒░█#@&%Ж҉';
  return s.split('').map(c => (c !== ' ' && c !== '\n' && Math.random() < amt) ? g[Math.floor(Math.random() * g.length)] : c).join('');
}

      for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) { const row = Math.floor(j / 4); px.p(X + i, Y + j, (j % 4 === 3) ? '#5a3a1e' : (H(i, row, 2) < .2 ? '#a06e3e' : '#94643a')); }
      for (let r = 0; r < 4; r++) { const off = Math.floor(H(r, ty, 7) * 16); px.vl(X + off, Y + r * 4, Y + r * 4 + 2, '#6e4a28'); }
      break;
    }
    case G_.IWALL: {
      const pal = map.wall || ['#7b5a8c', '#6a4b7a', '#c9a24a'];
      const isF = (v) => v !== null && v !== G_.IWALL && v !== G_.VOID && v !== G_.DWALL;
      const face = isF(at(0, 1)) || (at(0, 1) === G_.IWALL && isF(at(0, 2)));
      if (!face) {
        // верх стены (вид сверху): тёмное дерево с окантовкой со стороны пола
        px.r(X, Y, 16, 16, '#2a1a10');
        for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) if (H(i >> 2, j, 5) < .08) px.p(X + i, Y + j, '#332014');
        if (isF(at(1, 0))) { px.vl(X + 13, Y, Y + 15, '#5a3820'); px.vl(X + 14, Y, Y + 15, '#8a5a32'); px.vl(X + 15, Y, Y + 15, '#3a2414'); }
        if (isF(at(-1, 0))) { px.vl(X + 2, Y, Y + 15, '#5a3820'); px.vl(X + 1, Y, Y + 15, '#8a5a32'); px.vl(X, Y, Y + 15, '#3a2414'); }
        if (isF(at(0, -1))) { px.hl(X, X + 15, Y + 2, '#5a3820'); px.hl(X, X + 15, Y + 1, '#8a5a32'); px.hl(X, X + 15, Y, '#3a2414'); }
        break;
      }
      const lower = isF(at(0, 1));
      // обои: вертикальные полосы с мелким узором
      for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) {
        const gx = i + tx * 16, st = gx % 8;
        let c = st < 3 ? pal[1] : pal[0];
        if (st === 5 && (j + Y) % 6 === 2) c = pal[2];
        if (st === 3 || st === 7) c = mix(pal[0], pal[1], .5);
        px.p(X + i, Y + j, c);
      }
      if (!isF(at(0, 2)) && at(0, -1) !== G_.IWALL) { px.r(X, Y, 16, 3, '#5a3a22'); px.hl(X, X + 15, Y + 3, '#8a5a32'); px.hl(X, X + 15, Y, '#3a2414'); }
      else if (at(0, -1) !== G_.IWALL) { px.r(X, Y, 16, 2, '#5a3a22'); px.hl(X, X + 15, Y + 2, '#8a5a32'); }
      if (lower) {
        // деревянная панель и плинтус
        px.r(X, Y + 6, 16, 10, '#8a5a32');
        px.hl(X, X + 15, Y + 6, '#b07a42'); px.hl(X, X + 15, Y + 7, '#5a3a22');
        for (let i = 0; i < 16; i += 8) { const x0 = X + i + 1; px.r(x0, Y + 9, 6, 4, '#7a4e2a'); px.hl(x0, x0 + 5, Y + 9, '#5a3a22'); px.vl(x0, Y + 9, Y + 12, '#5a3a22'); px.hl(x0, x0 + 5, Y + 13, '#a06e3e'); px.vl(x0 + 5, Y + 9, Y + 13, '#a06e3e'); }
        px.r(X, Y + 14, 16, 2, '#4a2e18'); px.hl(X, X + 15, Y + 14, '#6a4426');
      }
      break;
    }
    case G_.BRIDGE: {
      const vert = WATERY.has(at(-1, 0) || 0) && WATERY.has(at(1, 0) || 0);
      px.r(X, Y, 16, 16, '#8a5a30');
      if (vert) { for (let j = 0; j < 16; j += 4) { px.hl(X, X + 15, Y + j, '#5a3818'); } px.vl(X, Y, Y + 15, '#4a2e14'); px.vl(X + 15, Y, Y + 15, '#4a2e14'); }
      else { for (let i = 0; i < 16; i += 4) { px.vl(X + i, Y, Y + 15, '#5a3818'); } px.hl(X, X + 15, Y, '#4a2e14'); px.hl(X, X + 15, Y + 15, '#4a2e14'); }
      break;
    }
    case G_.DFLOOR: {
      const th = DUNGEON_THEMES[map.dtheme || 'cellar'];
      fillNoise(th.floor.concat([shade(th.floor[0], .1)]), 21);
      if (H(0, 0, 40) < .25) { const i = Math.floor(H(1, 0, 41) * 10) + 2, j = Math.floor(H(0, 1, 42) * 10) + 2; px.line(X + i, Y + j, X + i + 3, Y + j + 2, shade(th.floor[0], -.3)); px.line(X + i + 3, Y + j + 2, X + i + 4, Y + j + 5, shade(th.floor[0], -.3)); }
      if (map.dtheme === 'library' && H(2, 2, 43) < .3) { const j = 3 + Math.floor(H(3, 3, 44) * 10); px.hl(X + 2, X + 2 + Math.floor(H(4, 4, 45) * 10), Y + j, '#999'); }
      if (map.dtheme === 'flesh' && H(5, 5, 46) < .2) { px.circ(X + 8, Y + 8, 2, '#8a1a24'); }
      break;
    }
    case G_.DWALL: {
      const th = DUNGEON_THEMES[map.dtheme || 'cellar'];
      const below = at(0, 1);
      if (below !== null && below !== G_.DWALL && below !== G_.VOID) {
        for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) { const brick = ((Math.floor(j / 4) % 2) ? (i + 4) : i) % 8 === 0 || j % 4 === 0; px.p(X + i, Y + j, brick ? th.wallF[1] : th.wallF[0]); }
        px.hl(X, X + 15, Y, shade(th.wallF[0], .25)); px.hl(X, X + 15, Y + 15, shade(th.wallF[1], -.4));
        if (map.dtheme === 'library') { for (let i = 1; i < 15; i += 3) { px.r(X + i, Y + 3, 2, 10, ['#7a2a2a', '#2a3a6a', '#3a5a2a', '#5a4a2a'][Math.floor(H(i, ty, 5) * 4)]); } px.hl(X, X + 15, Y + 13, '#3a2a1a'); }
        if (map.dtheme === 'flesh' && H(3, 3, 9) < .3) { px.ell(X + 8, Y + 8, 3, 2, '#f0e0d0'); px.circ(X + 8, Y + 8, 1, '#200'); }
      } else { px.r(X, Y, 16, 16, th.wall); for (let k = 0; k < 4; k++) px.p(X + Math.floor(H(k, 1, 3) * 16), Y + Math.floor(H(k, 2, 3) * 16), shade(th.wall, .15)); }
      break;
    }
    case G_.CARPET: { px.r(X, Y, 16, 16, '#8a2030'); for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) if ((i + j) % 6 === 0) px.p(X + i, Y + j, '#a8343f'); px.r(X, Y, 16, 1, '#c9a24a', 80); break; }
    case G_.TILE: { for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) px.p(X + i, Y + j, ((i >> 3) + (j >> 3)) % 2 ? '#d8e2e6' : '#b9cad2'); break; }
    case G_.PAPER: { px.r(X, Y, 16, 16, '#efece4'); for (let j = 2; j < 16; j += 4) px.hl(X, X + 15, Y + j, '#cfd6e0'); if (tx % 6 === 0) px.vl(X + 2, Y, Y + 15, '#e0a0a0'); break; }
    case G_.VOID: default: px.r(X, Y, 16, 16, '#000'); break;
  }
}

/* ---------- объекты (16x16 и крупнее) ---------- */
const OBJ_ART = {};
function treeSprite(kind, season, stage = 3, face = false) {
  return spr(`tree:${kind}:${season}:${stage}:${face}`, () => {
    if (stage < 3) { // саженец
      const p = new PX(16, 16);
      p.vl(8, 7, 15, '#6a4a2a'); p.p(9, 10, '#8a6a3a');
      const c = season === 2 ? '#c87a30' : '#4f9a3a';
      p.circ(8, 6 - stage, 2 + stage, shade(c, -.2)); p.circ(7, 5 - stage, 1 + stage, c); p.p(6, 4 - stage, shade(c, .35));
      p.selOutline(.6); return p.done();
    }
    const p = new PX(32, 48);
    const trunk = kind === 'dead' ? '#4e4444' : '#6e4a2a', trunkD = shade(trunk, -.32), trunkL = shade(trunk, .22);
    // корни и ствол
    p.poly([[12, 47], [20, 47], [19, 30], [13, 30]], trunk);
    p.poly([[9, 47], [13, 43], [14, 47]], trunk); p.poly([[23, 47], [19, 43], [18, 47]], trunk);
    for (let y = 30; y < 47; y++) { p.p(13, y, trunkL); p.p(19, y, trunkD); if (y % 4 === 0) p.p(16, y, trunkD); if (y % 5 === 2) p.p(15, y + 1, trunkD); }
    p.p(17, 38, trunkD); p.p(17, 37, shade(trunk, -.45)); p.hl(9, 23, 47, trunkD);
    if (face) { p.r(14, 35, 1, 2, '#000'); p.r(17, 35, 1, 2, '#000'); p.p(14, 35, '#ff2030'); p.p(17, 35, '#ff2030'); p.hl(14, 17, 40, '#000'); p.p(15, 41, '#000'); }
    const seasonCols = {
      oak: [['#5aa83c', '#3d8a2c', '#86cc5e', '#f6b0cc'], ['#3f8f2e', '#2a6a20', '#62b242', '#d02a2a'], ['#d9772b', '#a8481a', '#f2a845', '#f6d060'], null],
      pine: [['#2f7a46', '#1d5232', '#4f9e62'], ['#2a6e40', '#1a4a2c', '#45905a'], ['#2f6e46', '#1d4c32', '#4a8a5e'], ['#2f6e46', '#1d4c32', '#ffffff']],
      maple: [['#6ab04c', '#468830', '#92d26c'], ['#4a9a3a', '#2e6e24', '#6eb85a'], ['#c8302a', '#821818', '#f06040', '#f2a040'], null],
      dead: [null, null, null, null],
    }[kind] || [];
    const cols = seasonCols[season];
    if (kind === 'pine') {
      const c = cols;
      for (let k = 0; k < 4; k++) {
        const y0 = 3 + k * 7, w = 5 + k * 3, yb = y0 + 11;
        const pts = [[16, y0 - 2]]; for (let x = 16 + w; x >= 16 - w; x -= 2) pts.push([x, yb - ((x / 2) % 2 ? 1 : 0)]);
        p.poly(pts, c[1]);
        p.poly([[16, y0 - 2], [17, yb - 2], [16 - w + 2, yb - 2]], c[0]);
        p.poly([[16, y0], [16 - w / 3, y0 + 6], [15, y0 + 6]], c[2]);
        for (let x = 16 - w + 1; x < 16 + w; x += 3) p.p(x, yb - 2, shade(c[1], -.2));
        if (season === 3) { p.hl(16 - w + 2, 16 + w - 3, yb - 2, '#ffffff'); p.hl(16 - w + 3, 16, yb - 3, '#e8f0ff'); p.p(16, y0 - 1, '#fff'); }
      }
    } else if (cols) {
      const blobs = [[16, 15, 11], [7, 21, 7], [25, 21, 7], [11, 9, 7], [21, 9, 7], [16, 25, 8], [9, 15, 6], [23, 15, 6]];
      for (const [x, y, r] of blobs) p.circ(x, y, r, cols[1]);
      for (const [x, y, r] of blobs) p.circ(x - 1, y - 2, r - 2, cols[0]);
      for (const [x, y, r] of blobs) p.circ(x - 3, y - 4, Math.max(1, r - 5), cols[2]);
      // фактура листвы: «чешуйки» снизу каждого облачка
      for (const [x, y, r] of blobs) for (let a = .3; a < 2.9; a += .55) { const lx = x + Math.cos(a) * (r - 2), ly = y + Math.sin(a) * (r - 2); p.p(lx, ly, shade(cols[1], -.25)); p.p(lx + 1, ly - 1, cols[1]); }
      for (let k = 0; k < 14; k++) { const x = 4 + Math.floor(U.hash(k, 3, kind.length) * 22), y = 3 + Math.floor(U.hash(k, 4, season) * 20); p.p(x, y, cols[2]); p.p(x + 1, y, shade(cols[2], .2)); }
      if (cols[3]) for (let k = 0; k < 10; k++) { const x = 4 + Math.floor(U.hash(k, 7, 1) * 24), y = 4 + Math.floor(U.hash(k, 8, 1) * 22); if (p.a(x, y)) { p.p(x, y, cols[3]); if (season !== 1) p.p(x + 1, y, shade(cols[3], .3)); } }
      // ветка сквозь крону
      p.line(16, 30, 16, 26, trunk); p.line(16, 27, 12, 24, trunkD);
    } else { // голые ветки
      const bc = kind === 'dead' ? '#3a3232' : '#5a4030', bl = shade(bc, .25);
      const br = [[16, 30, 16, 6], [16, 20, 6, 10], [16, 16, 26, 6], [16, 24, 25, 16], [16, 26, 7, 18], [10, 14, 9, 7], [22, 11, 24, 3], [6, 10, 3, 8], [26, 6, 29, 5]];
      for (const [a, b, c, d] of br) { p.line(a, b, c, d, bc); p.line(a - 1, b, c - 1, d, bl); }
      p.r(15, 22, 3, 9, bc);
      if (season === 3 && kind !== 'dead') for (const [x, y] of [[6, 9], [26, 5], [16, 5], [25, 15], [9, 17], [10, 7]]) { p.p(x, y, '#fff'); p.p(x + 1, y, '#e8f0ff'); }
    }
    p.selOutline(.62);
    return p.done();
  });
}

function objSprite(o, frame = 0) {
  const t = o.t;
  switch (t) {
    case 'rock': return spr(`rock:${o.kind}:${o.v || 0}:${o.dt || ''}`, () => {
      const p = new PX(16, 16);
      const dark = o.dt === 'flesh' ? '#6a3a3e' : o.dt === 'library' ? '#c8c4bc' : o.dt === 'flooded' ? '#5f6e78' : '#7c7570';
      const big = o.kind === 'boulder';
      p.ell(8, 10, big ? 7 : 6, big ? 6 : 5, shade(dark, -.25));
      p.ell(7, 9, big ? 6 : 5, big ? 5 : 4, dark);
      p.ell(6, 7, 3, 2, shade(dark, .25));
      const ores = { copper: ['#e07a3a', '#ffb070'], iron: ['#c8d0d8', '#ffffff'], gold: ['#f2c430', '#fff2a0'], gem: ['#b04ae0', '#ff9cff'], coal: ['#1a1a1a', '#444'], mystic: ['#40e0d0', '#ff60ff'], geode: ['#a0784a', '#d8b080'] }[o.kind];
      if (ores) { for (let k = 0; k < 5; k++) { const x = 4 + Math.floor(U.hash(k, o.v || 0, 2) * 8), y = 6 + Math.floor(U.hash(k, 3, (o.v || 0) + 1) * 6); p.p(x, y, ores[0]); p.p(x + 1, y, ores[0]); p.p(x, y - 1, ores[1]); } }
      if (o.kind === 'geode') { p.ell(8, 10, 5, 4, '#8a6a44'); p.line(6, 8, 10, 12, '#4a3a24'); }
      p.selOutline(.62); return p.done();
    });
    case 'weed': return spr(`weed:${S.season}:${o.v || 0}`, () => {
      const p = new PX(16, 16); const c = [['#4f8f2e', '#6bb83e'], ['#3f7f26', '#5aa83a'], ['#a07a2a', '#c89a3a'], ['#7a8a8a', '#a0b0b0']][S.season];
      const v = o.v || 0;
      for (let k = 0; k < 6; k++) { const x = 3 + k * 2 + (v % 2), h = 4 + Math.floor(U.hash(k, v, 3) * 6); p.line(x, 14, x + (k % 2 ? 1 : -1), 14 - h, k % 2 ? c[0] : c[1]); }
      if (v % 3 === 0) { p.p(6, 6, '#f0e060'); p.p(11, 7, '#f0e060'); }

    case 'twig': return spr('twig', () => { const p = new PX(16, 16); p.line(3, 12, 13, 8, '#7a5230'); p.line(5, 9, 9, 11, '#6a4224'); p.line(10, 9, 12, 6, '#7a5230'); p.selOutline(.62); return p.done(); });
    case 'stump': return spr('stump', () => { const p = new PX(16, 16); p.ell(8, 11, 6, 4, '#6b4a2b'); p.ell(8, 9, 6, 3, '#c4955a'); p.ring(8, 9, 2, '#8a6236'); p.selOutline(.62); return p.done(); });
    case 'bigstump': return spr('bigstump', () => { const p = new PX(32, 32); p.ell(16, 20, 13, 9, '#5a3a20'); p.ell(16, 16, 13, 7, '#b88a52'); p.ring(16, 16, 4, '#8a6236'); p.ring(16, 16, 8, '#8a6236'); p.line(4, 22, 1, 28, '#5a3a20'); p.line(28, 22, 31, 28, '#5a3a20'); p.selOutline(.62); return p.done(); });

      const p = new PX(16, 16); p.r(6, 3, 4, 12, '#8a5a30'); p.vl(9, 3, 14, '#5a3818'); p.hl(6, 9, 3, '#b07a42');

    });
    case 'chest': return spr('chest', () => { const p = new PX(16, 16); p.r(2, 5, 12, 10, '#8a5228'); p.r(2, 5, 12, 4, '#a86a34'); p.hl(2, 13, 9, '#4a2810'); p.r(7, 8, 2, 3, '#f2c430'); p.vl(2, 5, 14, '#c9a24a'); p.vl(13, 5, 14, '#c9a24a'); p.selOutline(.62); return p.done(); });

/* ---------- постройки ---------- */
function buildingSprite(kind, night = false) {
  return spr(`bld:${kind}:${night ? 1 : 0}:${S.season === 3 ? 1 : 0}:${S.flags && S.flags.greenhouse ? 1 : 0}`, () => {
    const B = BUILD_STYLES[kind];
    const w = B.w * 16, h = (B.h + B.roofH) * 16;
    const p = new PX(w, h);
    const wallTop = B.roofH * 16 - 4, wallH = h - wallTop;
    const snow = S.season === 3;
    const wl = B.wall, wD = shade(wl, -.2), wDD = shade(wl, -.38), wL = shade(wl, .15);
    // стены
    p.r(0, wallTop, w, wallH, wl);
    if (B.planks) for (let y = wallTop; y < h; y += 4) { p.hl(0, w - 1, y, wD); p.hl(0, w - 1, y + 1, wL); for (let x = (y * 7) % 13; x < w; x += 13) p.vl(x, y + 1, y + 3, wD); for (let x = (y * 5) % 17 + 2; x < w; x += 17) p.p(x, y + 2, wDD); }
    if (B.bricks) for (let y = wallTop; y < h; y += 4) { p.hl(0, w - 1, y, wD); for (let x = ((y / 4) % 2) * 4; x < w; x += 8) { p.vl(x, y, y + 3, wD); p.hl(x + 1, x + 6, y + 1, wL); } }
    if (B.logs) for (let y = wallTop; y < h; y += 5) { p.hl(0, w - 1, y, wDD); p.hl(0, w - 1, y + 1, wL); p.hl(0, w - 1, y + 4, wD); p.circ(1, y + 2, 1, shade(wl, .25)); p.circ(w - 2, y + 2, 1, shade(wl, .25)); }
    // угловые столбы и фундамент
    p.r(0, wallTop, 3, wallH, wD); p.vl(0, wallTop, h - 1, wDD); p.r(w - 3, wallTop, 3, wallH, wDD); p.vl(1, wallTop, h - 1, wL);
    for (let x = 0; x < w; x += 6) { p.r(x, h - 4, 6, 4, x % 12 ? '#7a7470' : '#8a847e'); p.hl(x, x + 5, h - 4, '#a8a29c'); p.vl(x, h - 4, h - 1, '#5a5450'); }
    // тень от крыши на стене
    p.r(0, wallTop + 6, w, 3, wDD, 90);
    // крыша
    const rc = B.roof, rd = shade(rc, -.28), rl = shade(rc, .22), rdd = shade(rc, -.45);
    if (B.roofStyle === 'gable') {
      p.poly([[-2, wallTop + 7], [w + 2, wallTop + 7], [w - 10, 2], [10, 2]], rc);
      for (let y = 4, row = 0; y < wallTop + 7; y += 4, row++) { p.hl(0, w - 1, y, rd); for (let x = (row % 2) * 4; x < w; x += 8) { p.vl(x, y + 1, y + 3, rd); p.p(x + 1, y + 1, rl); } }
      p.hl(-2, w + 2, wallTop + 7, rdd); p.hl(-2, w + 2, wallTop + 8, rdd); p.hl(10, w - 10, 2, rl); p.hl(9, w - 9, 3, rl);
      p.line(10, 2, -2, wallTop + 7, rdd); p.line(w - 10, 2, w + 2, wallTop + 7, rdd);
      if (snow) { p.poly([[10, 2], [w - 10, 2], [w - 6, 7], [6, 7]], '#f4f8fb'); for (let x = 4; x < w - 4; x += 5) p.vl(x, 7, 8 + (x % 3), '#f4f8fb'); p.hl(10, w - 10, 3, '#ffffff'); for (let x = 2; x < w; x += 7) p.vl(x, wallTop + 8, wallTop + 9 + (x % 3), '#dfeaf5'); }
    } else if (B.roofStyle === 'spire') { // часовня
      p.poly([[-2, wallTop + 7], [w + 2, wallTop + 7], [w / 2, 10]], rc);
      for (let y = 14, row = 0; y < wallTop + 7; y += 4, row++) { p.hl(0, w - 1, y, rd, 150); for (let x = (row % 2) * 4; x < w; x += 8) p.vl(x, y + 1, y + 3, rd, 120); }
      p.hl(-2, w + 2, wallTop + 7, rdd);

        p.hl(5, 10, 12, '#fff'); p.vl(6, 21, 23 - s, '#f0e8e0'); p.vl(9, 21, 22 + s, '#f0e8e0');
        p.ell(8, 7, 5, 5, '#f4ece6'); p.r(4, 2, 9, 3, '#e8c060'); p.vl(3, 3, 12, '#e8c060'); p.vl(13, 3, 12, '#e8c060');
        p.r(6, 6, 1, 2, '#2a4aa0'); p.r(10, 6, 1, 2, '#2a4aa0'); p.p(8, 10, '#c03040');
        p.line(10, 3, 9, 9, '#3a2a2a'); // трещина
        if (variant === 'angry') { p.r(6, 6, 1, 2, '#f00'); p.r(10, 6, 1, 2, '#f00'); p.hl(6, 10, 10, '#000'); }
        p.outline('#1a0a0a'); return p.done();
      }
      case 'shadow': {
        const p = new PX(24, 32); const s = frame % 2;
        p.ell(12, 9, 6, 7, '#120c16'); p.poly([[4, 16], [20, 16], [22, 28], [2, 28]], '#120c16');
        p.line(4, 16, 0, 26 + s, '#120c16'); p.line(20, 16, 24, 26 - s, '#120c16'); p.line(8, 28, 6 + s, 31, '#120c16'); p.line(16, 28, 18 - s, 31, '#120c16');
        p.r(8, 8, 2, 2, '#e0d0ff'); p.r(14, 8, 2, 2, '#e0d0ff'); p.speck(2, 2, 20, 28, ['#2a2030'], .06, frame);
        return p.done();
      }
      case 'mushroom': {
        const p = new PX(16, 16); const s = frame % 2;
        p.r(6, 9, 4, 6, '#e8dcc8'); p.ell(8, 7 + s, 7, 4, '#c8302a'); p.circ(5, 6 + s, 1, '#fff'); p.circ(10, 5 + s, 1, '#fff'); p.p(12, 8 + s, '#fff');
        p.p(7, 11, '#000'); p.p(9, 11, '#000'); p.hl(7, 9, 13, '#5a2a2a');
        p.outline('#2a0a0a'); return p.done();
      }
      case 'ink': {
        const p = new PX(16, 16); const s = frame % 2;
        p.ell(8, 10, 7, 5 - s, '#0a0a0a'); p.circ(4, 6 + s, 2, '#0a0a0a'); p.circ(11, 5 - s, 2, '#0a0a0a');
        p.r(5, 9, 2, 2, '#fff'); p.r(10, 9, 2, 2, '#fff'); p.p(6, 10, '#c00'); p.p(10, 10, '#c00');
        return p.done();
      }
      case 'crow': {
        const p = new PX(16, 16); const s = frame % 2;
        p.ell(8, 9, 4, 3, '#1a1a22'); p.circ(11, 6, 2, '#1a1a22'); p.poly([[13, 6], [16, 7], [13, 7]], '#e0a020'); p.p(11, 5, '#f00');
        if (s) p.poly([[5, 8], [1, 3], [8, 7]], '#2a2a32'); else p.poly([[5, 9], [1, 12], [8, 10]], '#2a2a32');
        p.vl(7, 12, 14, '#e0a020'); p.vl(9, 12, 14, '#e0a020');
        return p.done();
      }
      case 'shade': {
        const p = new PX(16, 40);
        for (let y = 0; y < 40; y++) { const w = y < 8 ? 3 : y < 34 ? 4 + Math.floor(y / 12) : 6; p.hl(8 - w, 8 + w, y, '#050305', y > 34 ? 255 - (y - 34) * 40 : 240); }
        p.p(6, 4, '#fff'); p.p(10, 4, '#fff'); p.line(4, 12, 1, 30 + frame % 2, '#050305'); p.line(12, 12, 15, 30 - frame % 2, '#050305');
        return p.done();
      }
      case 'kingslime': {
        const p = new PX(48, 44); const sq = frame % 2;
        p.ell(24, 30 + sq, 22 + sq * 2, 13 - sq, '#2e8a26'); p.ell(24, 28 + sq, 20 + sq * 2, 12 - sq, '#5ac84a'); p.ell(14, 22 + sq, 5, 2, '#b8f0a8');
        p.r(14, 26, 5, 5, '#111'); p.r(29, 26, 5, 5, '#111'); p.r(15, 27, 2, 2, '#fff'); p.r(30, 27, 2, 2, '#fff');
        p.poly([[16, 34 + sq], [32, 34 + sq], [28, 38 + sq], [20, 38 + sq]], '#1a3a10');
        p.poly([[12, 16 + sq], [36, 16 + sq], [38, 4 + sq], [31, 10 + sq], [24, 2 + sq], [17, 10 + sq], [10, 4 + sq]], '#f2c430'); p.circ(24, 10 + sq, 2, '#d02030'); p.circ(15, 12 + sq, 1, '#4a8ae0'); p.circ(33, 12 + sq, 1, '#4a8ae0');
        p.outline('#0a1808'); return p.done();
      }
      case 'hatter': {
        const p = new PX(32, 48); const s = frame % 2;
        p.r(6, 0, 20, 14, '#3a2a5a'); p.hl(2, 29, 14, '#2a1a4a'); p.hl(2, 29, 15, '#2a1a4a'); p.r(6, 10, 20, 3, '#d02030'); p.r(20, 4, 5, 6, '#f2f2f2'); p.p(22, 6, '#000');
        p.ell(16, 21, 7, 6, '#f2dcc8'); p.r(12, 19, 2, 3, '#000'); p.r(19, 19, 2, 3, '#000'); p.p(12, 19, '#ff0'); p.p(19, 19, '#ff0');
        p.poly([[11, 24], [21, 24], [19, 27], [13, 27]], '#2a0a0a'); for (let x = 12; x < 21; x += 2) p.p(x, 24, '#fff');
        p.vl(8, 14, 26, '#e07a20'); p.vl(24, 14, 26, '#e07a20');
        p.poly([[6, 28], [26, 28], [28, 44], [4, 44]], '#3a6a3a'); p.poly([[13, 28], [19, 28], [16, 36]], '#f2f2f2'); p.circ(16, 30, 2, '#f2c430');
        p.line(6, 30, 0, 38 - s * 3, '#3a6a3a'); p.line(26, 30, 32, 36 + s * 3, '#3a6a3a');
        p.ell(1, 39 - s * 3, 3, 2, '#f8f8f8'); p.r(30, 34 + s * 3, 3, 3, '#f8f8f8');
        p.r(8, 44, 5, 4, '#2a1a1a'); p.r(19, 44, 5, 4, '#2a1a1a');
        p.outline('#0a0610'); return p.done();
      }
      case 'author': {
        const p = new PX(32, 52); const s = frame % 2;
        // платье
        p.poly([[10, 24], [22, 24], [28, 50], [4, 50]], '#18141a'); for (let k = 0; k < 6; k++) p.circ(5 + k * 4.5, 49, 2, '#f0f0f0');
        p.poly([[12, 24], [20, 24], [16, 34]], '#f0f0f0'); p.circ(16, 26, 2, '#b01020');
        // руки и перо
        p.line(10, 26, 4, 34 + s, '#18141a'); p.line(22, 26, 28, 20 - s, '#18141a');
        p.line(28, 20 - s, 31, 2 - s, '#f0eadc'); p.line(29, 20 - s, 32, 4 - s, '#c8c0b0'); p.p(28, 21 - s, '#000');
        // голова
        p.ell(16, 14, 7, 8, '#f4e8e0'); p.ell(16, 10, 9, 6, '#1a1418'); p.r(7, 10, 3, 16, '#1a1418'); p.r(22, 10, 3, 16, '#1a1418');
        p.r(12, 14, 2, 3, '#000'); p.r(18, 14, 2, 3, '#000'); p.p(12, 15, '#d02030'); p.p(19, 15, '#d02030');
        p.hl(13, 19, 19, '#800010');
        p.poly([[4, 4], [12, 7], [4, 10]], '#f0f0f0'); p.poly([[28, 4], [20, 7], [28, 10]], '#f0f0f0'); p.circ(16, 6, 2, '#b01020');
        for (let k = 0; k < 6; k++) p.p(4 + Math.floor(U.hash(k, s, 3) * 24), 30 + Math.floor(U.hash(s, k, 4) * 20), '#000');
        p.outline('#000'); return p.done();
      }
      case 'fairy': {
        const p = new PX(16, 16); const s = frame % 2;
        p.ell(4, 7 - s, 3, 4, '#d8ffe8', 160); p.ell(12, 7 - s, 3, 4, '#d8ffe8', 160);
        p.circ(8, 6, 2, '#f8e0c8'); p.hl(6, 10, 4, '#5aca5a'); p.r(7, 8, 3, 5, '#7ad87a'); p.p(7, 6, '#000'); p.p(9, 6, '#000');
        return p.done();
      }
      case 'zhmur': {
        const col = ['#9aff9a', '#ffd070', '#9ad0ff', '#ff9ad0', '#d0a0ff'][Number(variant) || 0];
        const p = new PX(12, 14); const s = frame % 2;
        p.ell(6, 8 + s, 5, 5 - s, col); p.p(4, 7 + s, '#000'); p.p(7, 7 + s, '#000'); p.vl(6, 1 + s, 3 + s, '#3a8a3a'); p.p(7, 1 + s, '#5ac85a');
        p.outline('#1a2a1a'); return p.done();
      }
      case 'frog': {
        const p = new PX(16, 16); const s = frame % 2;
        p.ell(8, 11 - s, 6, 4, '#4a9a3a'); p.circ(5, 7 - s, 2, '#5aab3c'); p.circ(11, 7 - s, 2, '#5aab3c'); p.p(5, 7 - s, '#000'); p.p(11, 7 - s, '#000');
        p.poly([[6, 5 - s], [10, 5 - s], [10, 2 - s], [8, 4 - s], [6, 2 - s]], '#f2c430'); p.hl(6, 10, 12 - s, '#2a5a1a');
        p.outline('#0a1a08'); return p.done();
      }
    }
    return mkCanvas(16, 16);
  });
}

/* ============================================================
   Иконки предметов 16x16
   ============================================================ */
const TIER_COL = ['#8a8a8a', '#c87a3a', '#d8dee6', '#f2c430', '#a0204a'];
const ICON = {
  tool(p, [kind, tier = 0]) {
    const m = TIER_COL[tier], h = '#7a4a24';
    switch (kind) {
      case 'hoe': p.line(3, 14, 11, 4, h); p.line(4, 14, 12, 4, shade(h, .2)); p.r(9, 2, 5, 3, m); p.r(12, 2, 2, 6, m); break;
      case 'can': p.r(3, 6, 8, 7, m); p.r(3, 6, 8, 2, shade(m, .3)); p.line(11, 8, 14, 5, m); p.p(15, 4, m); p.ring(6, 5, 2, shade(m, -.3)); p.p(5, 10, '#4aa0ff'); break;
      case 'axe': p.line(4, 14, 10, 3, h); p.line(5, 14, 11, 3, shade(h, .2)); p.poly([[8, 2], [14, 3], [13, 9], [9, 7]], m); p.line(13, 3, 13, 8, shade(m, .4)); break;
      case 'pick': p.line(4, 14, 10, 4, h); p.line(5, 14, 11, 4, shade(h, .2)); p.line(3, 5, 8, 2, m); p.line(8, 2, 14, 5, m); p.line(3, 6, 8, 3, shade(m, -.2)); p.line(8, 3, 14, 6, shade(m, -.2)); break;
      case 'scythe': p.line(4, 15, 9, 3, h); p.poly([[8, 2], [15, 3], [13, 6], [10, 4]], m); p.line(9, 2, 15, 3, shade(m, .5)); break;
      case 'rod': p.line(2, 15, 13, 2, h); p.line(3, 15, 14, 2, shade(h, .3)); p.line(14, 2, 14, 10, '#ddd'); p.p(14, 11, '#d02030'); p.r(3, 11, 3, 3, '#3a3a3a'); break;
    }
  },
  sword(p, [blade = '#c8d0d8', hilt = '#7a4a24', style = 0]) {
    if (style === 1) { p.poly([[3, 13], [12, 2], [14, 4], [5, 14]], blade); } // широкий
    else if (style === 2) { p.line(3, 13, 13, 3, blade); p.line(4, 13, 14, 3, shade(blade, .4)); p.line(13, 3, 14, 1, blade); } // рапира
    else if (style === 3) { p.poly([[3, 12], [10, 5], [14, 1], [13, 6], [5, 14]], blade); p.line(6, 11, 13, 3, shade(blade, .5)); } // лунный
    else if (style === 4) { p.line(3, 13, 9, 7, blade); p.line(4, 13, 10, 7, shade(blade, .4)); p.p(10, 6, blade); } // сломанный
    else if (style === 5) { p.line(3, 13, 12, 4, '#2a2a2a'); p.poly([[10, 6], [15, 0], [13, 5]], '#f0eadc'); } // перо
    else { p.line(3, 12, 13, 2, blade); p.line(4, 12, 14, 2, shade(blade, .4)); p.line(4, 13, 14, 3, shade(blade, -.2)); }
    p.line(2, 10, 6, 14, '#5a4a3a'); p.line(1, 15, 4, 12, hilt); p.p(1, 15, shade(hilt, -.3));
  },
  seed(p, [c1, c2 = '#6a4a2a']) {
    p.r(3, 2, 10, 12, '#e8dcc0'); p.r(3, 2, 10, 3, c1); p.r(4, 6, 8, 6, shade(c1, .5));
    p.ell(8, 9, 2, 2, c1); p.p(7, 8, shade(c1, .5)); p.hl(5, 10, 13, '#c8b898');
    for (let k = 0; k < 3; k++) p.p(5 + k * 3, 3, c2);
  },
  root(p, [c = '#f2e0a0', leaf = '#4a9a3a']) { p.poly([[5, 6], [11, 6], [9, 15], [7, 15]], c); p.line(6, 8, 9, 9, shade(c, -.2)); p.line(7, 11, 9, 12, shade(c, -.2)); p.line(8, 6, 5, 1, leaf); p.line(8, 6, 8, 0, leaf); p.line(8, 6, 11, 1, leaf); },
  round(p, [c, c2, eyes = 0, stem = '#4a7a2a']) { p.circ(8, 9, 5, c); p.circ(6, 7, 2, shade(c, .25)); if (c2) p.speck(4, 5, 9, 9, [c2], .1, 3); if (eyes) { p.r(5, 8, 2, 2, '#fff'); p.r(9, 8, 2, 2, '#fff'); p.p(6, 9, '#000'); p.p(10, 9, '#000'); } if (stem) p.vl(8, 2, 4, stem); },
  brain(p) { p.circ(8, 8, 6, '#f0a0b0'); p.line(8, 3, 8, 13, '#c06070'); for (const [a, b, c, d] of [[3, 6, 6, 8], [10, 7, 13, 5], [4, 11, 7, 10], [9, 11, 12, 12], [5, 4, 7, 6]]) p.line(a, b, c, d, '#c06070'); p.r(5, 13, 6, 2, '#4a9a3a'); },
  garlic(p) { p.ell(8, 10, 5, 4, '#f4f0e6'); p.vl(8, 7, 13, '#d8d0c0'); p.vl(5, 8, 12, '#d8d0c0'); p.vl(11, 8, 12, '#d8d0c0'); p.line(8, 6, 8, 1, '#7aaa5a'); },
  heart(p, [c = '#d82030']) { p.circ(5, 7, 3, c); p.circ(11, 7, 3, c); p.poly([[2, 8], [14, 8], [8, 15]], c); p.p(4, 5, '#ff9aa0'); p.hl(6, 10, 3, '#3a7a2a'); p.vl(8, 1, 3, '#3a7a2a'); },
  eyeberry(p) { for (const [x, y] of [[5, 6], [10, 7], [7, 11]]) { p.circ(x, y, 3, '#3a5ad0'); p.circ(x, y, 1, '#fff'); p.p(x, y, '#000'); } },
  skull(p) { p.ell(8, 8, 6, 6, '#7ac85a'); p.r(5, 7, 2, 2, '#1a3a1a'); p.r(9, 7, 2, 2, '#1a3a1a'); p.hl(6, 10, 11, '#1a3a1a'); p.p(7, 12, '#1a3a1a'); p.p(9, 12, '#1a3a1a'); p.line(3, 4, 5, 6, '#4a8a3a'); },
  pepper(p) { p.poly([[6, 4], [10, 4], [12, 9], [9, 15], [5, 9]], '#e02020'); p.line(7, 5, 6, 10, '#ff8080'); p.line(8, 4, 9, 1, '#3a7a2a'); },
  sunflower(p) { for (let a = 0; a < 8; a++) p.circ(8 + Math.round(Math.cos(a) * 4), 7 + Math.round(Math.sin(a) * 4), 2, '#f2c430'); p.circ(8, 7, 3, '#5a3a1a'); p.p(7, 6, '#fff'); p.p(9, 6, '#fff'); p.p(7, 7, '#000'); p.p(9, 7, '#000'); p.vl(8, 11, 15, '#3a7a2a'); },
  pumpkin(p, [face = 1]) { p.ell(8, 9, 7, 5, '#e07a20'); p.vl(5, 5, 13, '#b05a10'); p.vl(11, 5, 13, '#b05a10'); p.vl(8, 1, 4, '#4a6a2a'); if (face) { p.poly([[4, 7], [6, 7], [5, 9]], '#3a1a00'); p.poly([[10, 7], [12, 7], [11, 9]], '#3a1a00'); p.hl(5, 11, 11, '#3a1a00'); } },
  eggplant(p) { p.ell(9, 10, 4, 5, '#5a2a7a'); p.ell(8, 9, 2, 3, '#7a4a9a'); p.poly([[6, 4], [11, 4], [9, 6]], '#4a7a2a'); },
  cranberry(p) { for (const [x, y] of [[5, 6], [10, 6], [7, 10], [11, 11], [4, 11]]) { p.circ(x, y, 2, '#a01020'); p.p(x - 1, y - 1, '#ff6070'); } },
  beet(p) { p.circ(8, 10, 5, '#8a1a3a'); p.p(6, 8, '#c04060'); p.vl(8, 14, 15, '#8a1a3a'); p.line(8, 5, 5, 0, '#3a8a3a'); p.line(8, 5, 11, 0, '#a03050'); },
  mandrake(p) { p.poly([[5, 5], [11, 5], [12, 11], [9, 15], [7, 15], [4, 11]], '#c8a070'); p.p(6, 8, '#000'); p.p(9, 8, '#000'); p.ell(8, 11, 1, 1, '#3a1a0a'); p.line(4, 10, 1, 12, '#c8a070'); p.line(12, 10, 15, 12, '#c8a070'); p.line(8, 5, 5, 0, '#3a8a3a'); p.line(8, 5, 11, 0, '#3a8a3a'); },
  blackfruit(p) { p.circ(8, 9, 5, '#0a0a0e'); p.circ(6, 7, 1, '#4a2a6a'); p.vl(8, 1, 4, '#2a1a2a'); p.p(9, 9, '#d02030'); p.ring(8, 9, 6, '#6a2a9a'); },
  blackseed(p) { p.ell(8, 9, 3, 4, '#0a0a0e'); p.p(7, 7, '#5a3a8a'); p.ring(8, 9, 5, '#6a2a9a'); p.p(8, 9, '#d02030'); },
  flower(p, [c = '#f2e040', ctr = '#c87a20']) { for (let a = 0; a < 5; a++) p.circ(8 + Math.round(Math.cos(a * 1.26) * 3), 6 + Math.round(Math.sin(a * 1.26) * 3), 2, c); p.circ(8, 6, 1, ctr); p.line(8, 9, 8, 15, '#3a8a2a'); p.line(8, 12, 11, 10, '#3a8a2a'); },
  leek(p) { p.r(6, 8, 4, 7, '#f4f0e6'); p.poly([[6, 8], [10, 8], [13, 0], [10, 2], [8, 0], [5, 1]], '#4aaa3a'); },
  mushroom(p, [cap = '#c8a060', spots = null, stem = '#f0e8d8']) { p.r(6, 9, 4, 6, stem); p.ell(8, 7, 6, 4, cap); p.ell(6, 6, 2, 1, shade(cap, .3)); if (spots) { p.p(5, 6, spots); p.p(10, 5, spots); p.p(8, 8, spots); } },
  berry(p, [c = '#2a1a4a', leaf = '#3a8a2a']) { for (const [x, y] of [[6, 7], [10, 7], [8, 10], [6, 12], [10, 12]]) { p.circ(x, y, 2, c); p.p(x - 1, y - 1, shade(c, .5)); } p.line(8, 5, 10, 1, leaf); },
  grape(p) { for (const [x, y] of [[6, 5], [10, 5], [8, 8], [5, 9], [11, 9], [8, 12]]) { p.circ(x, y, 2, '#6a2a9a'); p.p(x - 1, y - 1, '#b080e0'); } p.vl(8, 1, 3, '#5a3a1a'); },
  crystal(p, [c = '#9ad0ff']) { p.poly([[8, 1], [13, 6], [8, 15], [3, 6]], c); p.line(8, 1, 8, 15, shade(c, .4)); p.line(3, 6, 13, 6, shade(c, -.2)); },
  holly(p) { p.poly([[2, 8], [7, 4], [8, 9]], '#2a7a2a'); p.poly([[14, 8], [9, 4], [8, 9]], '#2a7a2a'); p.circ(7, 11, 2, '#d02020'); p.circ(10, 11, 2, '#d02020'); },
  log(p, [c = '#8a5a30', end = '#c49a62']) { p.r(2, 6, 11, 7, c); p.hl(2, 12, 8, shade(c, -.2)); p.hl(2, 12, 11, shade(c, -.2)); p.ell(13, 9, 2, 3, end); p.p(13, 9, shade(end, -.3)); },
  stone(p, [c = '#8a8580']) { p.ell(8, 9, 6, 5, c); p.ell(7, 8, 4, 3, shade(c, .2)); p.p(5, 7, shade(c, .5)); p.line(9, 10, 12, 11, shade(c, -.3)); },
  fiber(p) { for (let k = 0; k < 5; k++) p.line(4 + k * 2, 15, 6 + k, 2 + (k % 2) * 2, k % 2 ? '#7aaa3a' : '#5a8a2a'); },
  ore(p, [c]) { p.ell(8, 9, 6, 5, '#6d6a70'); p.ell(7, 8, 4, 3, '#8d8a90'); for (const [x, y] of [[5, 7], [9, 9], [7, 11], [11, 7]]) { p.r(x, y, 2, 2, c); p.p(x, y, shade(c, .5)); } },
  bar(p, [c]) { p.poly([[2, 11], [5, 6], [14, 6], [11, 11]], c); p.poly([[2, 11], [11, 11], [11, 13], [2, 13]], shade(c, -.3)); p.poly([[11, 11], [14, 6], [14, 8], [11, 13]], shade(c, -.45)); p.line(5, 7, 12, 7, shade(c, .5)); },
  gem(p, [c]) { p.poly([[4, 6], [7, 3], [9, 3], [12, 6], [8, 14]], c); p.poly([[4, 6], [12, 6], [8, 14]], shade(c, -.2)); p.line(6, 4, 7, 6, shade(c, .6)); p.p(6, 5, '#fff'); },
  geode(p, [c = '#a0784a', inner = null]) { p.circ(8, 8, 6, c); p.speck(3, 3, 11, 11, [shade(c, -.3)], .2, 2); if (inner) { p.circ(8, 8, 3, inner); p.p(7, 7, '#fff'); } else p.line(5, 6, 10, 11, shade(c, -.5)); },

function portrait(id, emo = 'neutral', talk = false, blink = false) {
  return spr(`por:${id}:${emo}:${talk ? 1 : 0}:${blink ? 1 : 0}`, () => {
    const D = PORTRAITS[id] || PORTRAITS.player;
    const L = (typeof D === 'function') ? D() : D;
    if (L.special) return L.special(emo, talk, blink);

}
function drawPortrait(L, emo, talk = false, blink = false) {

  if (cl.cleave) { const [x, y0, y1] = cl.cleave; for (let y = y0; y <= y1; y++) { const id = pc.at(x, y); if (id >= 0 && pc.R[id].name === 'chest') p.p(x, y, y === y1 ? skT[3] : skT[4]); } }
  for (const sx of [1, -1]) for (let y = 56; y < 64; y++) { const x = 32 + sx * (fem ? 18 : 22) + sx * Math.round((y - 56) * .15); const id = pc.at(x, y); if (id >= 0 && pc.R[id].z >= 2 && pc.R[id].z < 2.2) p.p(x, y, pc.R[id].t[4]); }
  if (cl.cleave) for (const sx of [1, -1]) for (let k = 0; k < 4; k++) { const x = 32 + sx * (3 + k), y = 50 + (k > 1 ? 1 : 0); const id = pc.at(x, y); if (id >= 0 && pc.R[id].name === 'chest') p.p(x, y, skT[3]); }

function cropStage(soil) { const c = CROPS[soil.crop]; if (!c) return 0; if (soil.age >= c.days) return 4; return Math.min(3, Math.floor(soil.age / c.days * 4)); }
function cropSprite(id, stage, creepy) {
  return spr(`crop:${id}:${stage}:${creepy ? 1 : 0}`, () => {
    const C = CROPS[id]; const p = new PX(16, 24); const g = '#4a9a3a', gd = '#2f6e22', gl = '#7ac458';
    const base = 23;
    if (stage === 0) { p.p(7, base - 1, gl); p.p(9, base - 1, gl); p.p(8, base, g); p.p(6, base - 2, g); p.p(10, base - 2, g); }
    else if (C.look === 'black') {
      const h = 4 + stage * 4;
      p.line(8, base, 8, base - h, '#1a1018'); p.line(8, base - h / 2, 4, base - h / 2 - 3, '#1a1018'); p.line(8, base - h / 3, 12, base - h / 3 - 4, '#1a1018');
      if (stage >= 2) { p.ell(5, base - h / 2 - 4, 2, 1, '#3a1a3a'); p.ell(12, base - h / 3 - 5, 2, 1, '#3a1a3a'); }
      if (stage === 4) { p.circ(8, base - h - 2, 4, '#0a0a0e'); p.ring(8, base - h - 2, 5, '#6a2a9a'); p.ell(8, base - h - 2, 2, 1, '#f0f0f0'); p.p(8, base - h - 2, '#d02030'); }
      else if (stage === 3) { p.circ(8, base - h - 1, 2, '#2a1a2a'); }
    } else if (C.look === 'root') {
      const n = stage + 1;
      for (let k = 0; k < n + 1; k++) { const x = 5 + k * (6 / Math.max(1, n)); p.line(8, base, x, base - 3 - stage * 2 - (k % 2), k % 2 ? g : gl); }
      if (stage >= 3) p.line(8, base, 8, base - 9, gd);
      if (stage === 4) { p.ell(8, base - 1, 3, 2, C.col); p.p(7, base - 2, shade(C.col, .4)); if (creepy) { p.p(7, base - 1, '#000'); p.p(9, base - 1, '#000'); } }
    } else if (C.look === 'bush') {
      const r = 2 + stage; p.vl(8, base - r * 2, base, gd);
      p.circ(8, base - r - 1, r, g); p.circ(6, base - r - 2, Math.max(1, r - 2), gl); p.circ(10, base - r, Math.max(1, r - 1), gd);
      if (stage === 4) { for (const [x, y] of [[5, -8], [10, -6], [7, -4], [11, -10], [6, -11]]) { p.circ(x, base + y, 1, C.col); p.p(x - 1, base + y - 1, shade(C.col, .5)); if (creepy && x === 7) { p.p(x, base + y, '#000'); } } }
      else if (stage === 3) { p.p(6, base - 8, '#fff'); p.p(10, base - 6, '#fff'); }
    } else if (C.look === 'big') {
      const r = 2 + stage;
      p.ell(5, base - 3, r, 2, g); p.ell(11, base - 3, r, 2, gd); p.line(8, base, 8, base - 3 - stage * 2, gd); p.ell(8, base - 5 - stage, 2, 1 + stage / 2, gl);
      if (stage === 4) {
        p.ell(8, base - 6, 6, 5, C.col); p.ell(6, base - 8, 2, 2, shade(C.col, .35)); p.ell(8, base - 6, 6, 5, null);
        if (id === 'cauli') { p.line(8, base - 11, 8, base - 2, shade(C.col, -.3)); p.line(4, base - 7, 7, base - 6, shade(C.col, -.3)); p.line(9, base - 8, 12, base - 6, shade(C.col, -.3)); }
        if (id === 'pumpkin' || creepy) { p.p(6, base - 7, '#2a0a00'); p.p(10, base - 7, '#2a0a00'); p.hl(6, 10, base - 4, '#2a0a00'); }
        if (id === 'melon') { p.r(5, base - 8, 2, 2, '#1a3a1a'); p.r(9, base - 8, 2, 2, '#1a3a1a'); p.hl(6, 10, base - 4, '#1a3a1a'); }
      }
    } else if (C.look === 'tall') {
      const h = 4 + stage * 4; p.line(8, base, 8, base - h, gd); p.ell(5, base - h / 2, 2, 1, g); p.ell(11, base - h / 2 - 2, 2, 1, g);
      if (stage === 4) { for (let a = 0; a < 8; a++) p.circ(8 + Math.round(Math.cos(a) * 3), base - h - 2 + Math.round(Math.sin(a) * 3), 1, C.col); p.circ(8, base - h - 2, 2, '#5a3a1a'); p.p(7, base - h - 3, '#fff'); p.p(9, base - h - 3, '#fff'); p.p(7, base - h - 2, '#000'); p.p(9, base - h - 2, '#000'); }
    }
    p.outline('#14200f');
    return p.done();
  });
}

  /* ---------- вход в карту ---------- */
  onEnter(m) {
    if (m.theme === 'dungeon') {
      if (m.depth === 1 && !S.flags.well1) { S.flags.well1 = 1; setTimeout(() => narr('Ступени скользкие. Внизу пахнет землёй, железом и старой бумагой. Кто-то вёл здесь записи.'), 500); }
      if (m.depth === 5 && !S.flags.well5note) { S.flags.well5note = 1; setTimeout(() => UI.note('Костёр! Отдохни у него: здоровье, эстус и рассудок. Тут же можно повысить уровень за души.', 'good'), 800); }
      if (m.depth === 30 && !S.flags.lib) { S.flags.lib = 1; setTimeout(() => this.libraryEnter(), 600); }
      if (m.boss && m.bossPending && !S.flags['bossseen' + m.depth]) { S.flags['bossseen' + m.depth] = 1; setTimeout(() => UI.note('Впереди туманная стена. За ней — что-то большое. Подойди и коснись тумана.', 'bad'), 700); }
      return;
    }
    if (m.id === 'village' && !S.flags.villageTip) { S.flags.villageTip = 1; setTimeout(() => UI.note('Шепчущая Лощина. Поговори с жителями — у каждого над головой знак, пока ты не поговорил{|а} сегодня.'), 600); }
    if (m.id === 'chapel' && !S.flags.chapelSeen) { setTimeout(() => this.chapelFirst(), 400); return; }
    this.checkHeart(m);
  },
  checkHeart(m) {
    if (Game.locked()) return;
    for (const ev of HEART_EVENTS) {
      if (S.flags['ev_' + ev.id] || ev.map !== m.id) continue;
      if (hearts(ev.npc) < ev.h) continue;
      const t = hhmm(); if (ev.time && (t < ev.time[0] || t > ev.time[1])) continue;
      if (ev.cond && !ev.cond()) continue;
      if (!m.npcs.some(n => n.id === ev.npc) && !ev.noNpc) continue;
      S.flags['ev_' + ev.id] = 1;
      setTimeout(async () => { Game.lock(); try { await ev.fn(m); } finally { Game.unlock(); } }, 350);
      break;
    }
  },
  tick(m) {
    if (m.theme !== 'dungeon') this.checkHeart(m);
    // голос из колодца
    if (!S.flags.wellOpen && S.absDay >= 2 && m.id === 'farm' && S.time >= 1230) { S.flags.wellOpen = true; this.wellVoice(); return; }

    if (S.time === 1320 && m.outdoor && S.sanity < 40 && Math.random() < .3) this.marySighting();
    if (Fest.today() === 'spirits' && m.id === 'village' && S.time >= 1320 && !S.flags['spirits' + S.year]) { S.flags['spirits' + S.year] = 1; this.spiritsNight(); }
  },

const Mail = {
  send(id) { if (S.mail.includes(id) || S.mailRead.includes(id)) return; S.mail.push(id); },
  daily() {
    const d = S.absDay;
    if (d === 2) this.send('welcome');
    if (d === 3) { this.send('chapel'); this.send('pierrot'); }
    if (d === 4) this.send('furnace');
    if (d === 5) this.send('ms1');
    if (d === 7) this.send('joja');
    if (d === 8) this.send('lilith');
    if (S.wellMax >= 5) this.send('grave');
    if (hearts('rosa') >= 3) this.send('rosa');
    if (hearts('eva') >= 2) this.send('eva');
    if (hearts('kva') >= 3) this.send('kva');
    if (hearts('ophelia') >= 4) this.send('ophelia');
    if (S.day === 1 && S.season === 1) this.send('summer');
    if (S.day === 1 && S.season === 2) this.send('fall');
    if (S.day === 1 && S.season === 3) this.send('winter');
    if (S.flags.seedPlanted && S.sanity < 40) this.send('grandpa');
  },
  async open() {
    if (!S.mail.length) { UI.note('Почтовый ящик пуст. Только паук.'); return; }
    Game.lock();
    while (S.mail.length) {
      const id = S.mail.shift(); S.mailRead.push(id); const L = LETTERS[id]; if (!L) continue;
      let extra = '';
      if (L.items) { for (const [it, n] of L.items) Inv.give(it, n); extra = '\n\nВложено: ' + L.items.map(([it, n]) => ITEMS[it].n + ' ×' + n).join(', '); }
      if (L.recipe) { S.recipes[L.recipe] = 1; extra += '\n\nВыучен рецепт: ' + ITEMS[L.recipe].n; }
      if (L.flag) { S.flags[L.flag] = 1; extra += '\n\nВыучен рецепт: Печь'; }
      if (L.start) Quests.start(L.start);
      await UI.letter(`От: ${L.from}\n\n${T(L.text)}${extra}`, L.cursed);
    }
    Game.unlock();
  },
};

function qp(k) { return S.quests.prog[k] || 0; }

const Quests = {
  start(id) { if (!QUESTS[id] || S.quests.active.includes(id) || S.quests.done.includes(id)) return; S.quests.active.push(id); AU.sfx('quest'); UI.note('Новое задание: ' + QUESTS[id].t, 'good'); this.check(); },

  check() {
    if (!S) return;
    for (const id of S.quests.active.slice()) { const q = QUESTS[id]; if (q && q.done()) this.complete(id); }
    if (!S.quests.active.includes('q_ship') && !S.quests.done.includes('q_ship') && S.absDay >= 3) this.start('q_ship');
    const b = S.board; if (b && b.accepted && !b.done && b.kind !== 'bring' && qp(b.key) - b.base >= b.n) { b.done = true; S.money += b.reward; AU.sfx('quest'); UI.note(`Заказ выполнен! +${b.reward}з`, 'good'); if (b.npc) Social.addPts(b.npc, 150); S.stats.boardDone = (S.stats.boardDone || 0) + 1; }
  },
  event(kind, a, b) {
    const P_ = S.quests.prog; const inc = (k, n = 1) => P_[k] = (P_[k] || 0) + n;
    switch (kind) {
      case 'clear': inc('clear'); break;
      case 'plant': inc('plant'); inc('plant:' + a); break;
      case 'ship': inc('ship', a); break;
      case 'kill': inc('kill'); inc('kill:' + a); break;
      case 'fish': inc('fish'); inc('fish:' + a); break;
      case 'harvest': inc('harvest:' + a); break;

      } else {

        const f = U.pick(fishes); o = { kind, key: 'fish:' + f, n: 1, npc, reward: FISH[f].p * 4 + 100, text: `${NPCS[npc].short || NPCS[npc].n}: «Хочу на ужин: ${FISH[f].n}. Поймай одну.»` };

const Bundles = {
  doneCount() { return BUNDLES.filter(b => S.bundles[b.id] && S.bundles[b.id].done).length; },
  roomDone(room) { return BUNDLES.filter(b => b.room === room).every(b => S.bundles[b.id] && S.bundles[b.id].done); },
  give(b, k) {

    else { Inv.give(r, n); UI.note(`Награда: ${ITEMS[r].n} ×${n}`, 'good'); }
    if (b.room === 'Кладовая' && this.roomDone('Кладовая') && !S.flags.greenhouse) { S.flags.greenhouse = 1; for (const k of [...SPR.keys()]) if (k.startsWith('bld:')) SPR.delete(k); setTimeout(() => narr('Жмуримо облепили старую оранжерею на ферме. Стёкла срослись. Внутри — вечное лето. Здесь можно сажать что угодно в любой сезон.'), 500); }

    await UI.say('zhmur', 'Держи. Это её страница. Мы прятали её в гробу. Когда придёт время — мы поможем тебе сжечь её книгу.', 'happy');
    await Events.givePage(5); Quests.check();
    World.maps.village.dirtyGround = true; for (const k of [...SPR.keys()]) if (k.startsWith('bld:')) SPR.delete(k);

/* ============================================================
   Карты: построение поверхностных локаций, интерьеров и этажей Колодца
   ============================================================ */
const SOLID_OBJ = new Set(['tree', 'rock', 'stump', 'bigstump', 'fence', 'chest', 'scarecrow', 'keg', 'pjar', 'furnace', 'cookpot', 'campfire', 'bonfire',
  'crate', 'mailbox', 'bin', 'board', 'altar', 'grave', 'bed', 'tv', 'fireplace', 'kitchen', 'table', 'counter', 'shelf', 'anvil', 'arcade', 'piano', 'lamp',
  'plant', 'lamppost', 'well', 'cart', 'fountain', 'mirror', 'coffin', 'pot', 'pew', 'cauldron', 'bookstack', 'sign', 'weed', 'twig', 'sprinkler', 'qsprinkler', 'fog', 'door', 'manuscript', 'bush']);
const FLAT_OBJ = new Set(['rug', 'bloodstain', 'artifact', 'ladder', 'crack', 'flower']);
const OBJ_SIZE = { well: [2, 2], bin: [2, 1], board: [2, 1], fountain: [3, 2], cart: [2, 1], altar: [2, 1], table: [2, 1], fireplace: [2, 1], kitchen: [2, 1], piano: [2, 1], shelf: [2, 1], bigstump: [2, 2], rug: [2, 1], pew: [2, 1], manuscript: [2, 1] };

class GameMap {
  constructor(id, w, h, o = {}) {
    Object.assign(this, { id, w, h, name: '', outdoor: false, theme: 'town', music: 'day', fishZone: 'pond', light: 0, farmable: false }, o);
    this.ground = new Uint8Array(w * h).fill(o.fillT === undefined ? G_.GRASS : o.fillT);
    this.objs = new Array(w * h).fill(null);
    this.block = new Uint8Array(w * h);
    this.soil = this.farmable ? new Array(w * h).fill(null) : null;
    this.bigs = []; this.warps = {}; this.npcs = []; this.mons = []; this.drops = []; this.projs = []; this.parts = []; this.lights = [];
    this.dirtyGround = true;
  }
  inb(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  groundAt(x, y) { return this.inb(x, y) ? this.ground[y * this.w + x] : null; }
  set(x, y, t) { if (this.inb(x, y)) { this.ground[y * this.w + x] = t; this.dirtyGround = true; } }
  fill(x, y, w, h, t) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, t); }
  ellipse(cx, cy, rx, ry, t, jag = 0, seed = 1) { for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) { const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2; if (d <= 1 + (jag ? (U.hash(x, y, seed) - .5) * jag : 0)) this.set(x, y, t); } }
  objAt(x, y) { return this.inb(x, y) ? this.objs[y * this.w + x] : null; }
  soilAt(x, y) { return this.soil && this.inb(x, y) ? this.soil[y * this.w + x] : null; }
  put(x, y, o) {
    o.x = x; o.y = y;
    const [w, h] = o.w ? [o.w, o.h] : (OBJ_SIZE[o.t] || [1, 1]); o.w = w; o.h = h;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (this.inb(x + i, y + j)) this.objs[(y + j) * this.w + x + i] = o;
    return o;
  }
  remove(o) { for (let j = 0; j < (o.h || 1); j++) for (let i = 0; i < (o.w || 1); i++) { const k = (o.y + j) * this.w + o.x + i; if (this.objs[k] === o) this.objs[k] = null; } }
  building(kind, x, y, warpTo, tx, ty) {
    const B = BUILD_STYLES[kind];
    const b = { kind, x, y, w: B.w, h: B.h, door: B.door !== undefined ? { x: x + B.door, y: y + B.h - 1 } : null };
    for (let j = 0; j < B.h; j++) for (let i = 0; i < B.w; i++) this.block[(y + j) * this.w + x + i] = 1;
    if (b.door && warpTo) { this.block[b.door.y * this.w + b.door.x] = 0; this.warp(b.door.x, b.door.y, warpTo, tx, ty, 'up'); }
    this.bigs.push(b); return b;
  }
  warp(x, y, to, tx, ty, dir = 'down') { this.warps[x + ',' + y] = { to, tx, ty, dir }; }
  solidAt(x, y, forMon) {
    if (!this.inb(x, y)) return true;
    const k = y * this.w + x;
    if (this.block[k]) return true;
    if (SOLID_GROUND.has(this.ground[k])) return true;
    const o = this.objs[k];
    if (o && (SOLID_OBJ.has(o.t) || o.solid) && !o.walk) return true;
    return false;
  }
  isWater(x, y) { const g = this.groundAt(x, y); return g !== null && WATERY.has(g); }
  randomFree(pred, tries = 400) {
    for (let k = 0; k < tries; k++) { const x = U.ri(1, this.w - 2), y = U.ri(1, this.h - 2); if (!this.solidAt(x, y) && !this.objAt(x, y) && !this.warps[x + ',' + y] && (!pred || pred(x, y))) return { x, y }; }
    return null;
  }
  borderTrees(gaps, kinds = ['oak', 'pine']) {
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const edge = x < 2 || y < 2 || x >= this.w - 2 || y >= this.h - 2;
      if (!edge) continue;
      if (gaps.some(g => x >= g[0] && x <= g[2] && y >= g[1] && y <= g[3])) continue;
      if ((x + y) % 2 === 0 || x < 1 || y < 1 || x >= this.w - 1 || y >= this.h - 1) this.put(x, y, { t: 'tree', kind: U.hash(x, y, 5) < .5 ? kinds[0] : kinds[1], fixed: true });
      else this.set(x, y, G_.DGRASS), this.block[y * this.w + x] = 1;
    }
  }
}

/* ---------- ферма ---------- */
function buildFarm() {
  const m = new GameMap('farm', 40, 32, { name: 'Ферма «Чёрная Почва»', outdoor: true, theme: 'farm', music: 'day', fishZone: 'pond', farmable: true });
  m.borderTrees([[37, 13, 39, 17], [17, 29, 22, 31]]);
  // дорожки
  m.fill(8, 6, 1, 2, G_.DIRT); m.fill(8, 7, 31, 1, G_.DIRT); m.fill(38, 7, 1, 9, G_.DIRT); m.fill(36, 14, 4, 3, G_.DIRT);
  m.fill(20, 6, 1, 1, G_.DIRT); m.fill(33, 6, 2, 1, G_.DIRT);
  // пруд
  m.ellipse(5.5, 24.5, 3.6, 3.2, G_.WATER, .3, 3);
  // постройки
  m.building('house', 5, 3, 'house', 5, 8);
  m.building('greenhouse', 17, 3, 'greenhouse', 5, 8);
  m.put(11, 5, { t: 'mailbox' });
  m.put(12, 5, { t: 'bin' });
  m.put(33, 4, { t: 'well' });
  m.warp(39, 14, 'village', 1, 14, 'right'); m.warp(39, 15, 'village', 1, 15, 'right'); m.warp(39, 16, 'village', 1, 16, 'right');
  for (let x = 18; x <= 21; x++) m.warp(x, 31, 'forest', x, 1, 'down');
  // мусор на поле
  const r = RNG(1337);
  for (let y = 9; y < 29; y++) for (let x = 3; x < 37; x++) {
    if (m.objAt(x, y) || m.solidAt(x, y) || m.groundAt(x, y) !== G_.GRASS) continue;
    if (x < 10 && y > 19) continue;
    const v = r();
    if (v < .07) m.put(x, y, { t: 'weed', v: Math.floor(r() * 6) });
    else if (v < .11) m.put(x, y, { t: 'rock', kind: 'stone', hp: 1, v: Math.floor(r() * 4) });
    else if (v < .14) m.put(x, y, { t: 'twig' });
    else if (v < .155) m.put(x, y, { t: 'tree', kind: r() < .5 ? 'oak' : 'maple', hp: 10 });
    else if (v < .16) m.put(x, y, { t: 'stump', hp: 4 });
  }
  for (const [x, y] of [[25, 12], [14, 24]]) { m.remove(m.objAt(x, y) || { x, y, w: 1, h: 1 }); m.put(x, y, { t: 'bigstump', hp: 10 }); }
  m.put(10, 4, { t: 'flower', v: 0 }); m.put(4, 5, { t: 'bush' }); m.put(15, 5, { t: 'bush' });
  return m;
}

/* ---------- этажи Колодца ---------- */
function floorTheme(n) {
  if (n >= 31) return 'abyss'; if (n === 30) return 'library'; if (n > 20) return 'flesh'; if (n > 10) return 'flooded'; return 'cellar';
}
function buildFloor(n) {
  const th = floorTheme(n);
  const m = new GameMap('well:' + n, 34, 28, { name: n === 30 ? 'Библиотека Автора' : `Колодец · этаж ${n}`, outdoor: false, theme: 'dungeon', dtheme: th, music: th === 'library' ? 'library' : 'dungeon', fishZone: 'well', fillT: G_.DWALL, depth: n });
  m.dark = th === 'library' ? 0.55 : th === 'cellar' ? 0.74 : 0.78;
  if (n % 10 === 0 && n <= 30) return buildBossFloor(m, n);
  // клеточный автомат
  const W = m.w, H = m.h; let g = new Uint8Array(W * H);
  const r = Math.random;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) g[y * W + x] = (x < 2 || y < 2 || x >= W - 2 || y >= H - 2) ? 1 : (r() < .44 ? 1 : 0);
  for (let it = 0; it < 5; it++) {
    const ng = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (x < 2 || y < 2 || x >= W - 2 || y >= H - 2) { ng[y * W + x] = 1; continue; }
      let c = 0; for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) c += g[(y + j) * W + x + i];
      ng[y * W + x] = c >= 5 ? 1 : 0;
    }
    g = ng;
  }
  // крупнейшая область
  const lab = new Int32Array(W * H).fill(-1); let best = -1, bestN = 0, id = 0;
  for (let k = 0; k < W * H; k++) {
    if (g[k] || lab[k] >= 0) continue;
    const st = [k]; lab[k] = id; let cnt = 0;
    while (st.length) { const q = st.pop(); cnt++; const x = q % W, y = (q / W) | 0; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nk = (y + dy) * W + x + dx; if (!g[nk] && lab[nk] < 0) { lab[nk] = id; st.push(nk); } } }
    if (cnt > bestN) { bestN = cnt; best = id; } id++;
  }
  if (bestN < 180) return buildFloor(n);
  for (let k = 0; k < W * H; k++) m.ground[k] = (lab[k] === best) ? G_.DFLOOR : G_.DWALL;
  // вода/кровь
  if (th === 'flooded' || th === 'flesh' || th === 'abyss') {
    for (let k = 0; k < 3; k++) { const p = m.randomFree(); if (p) { for (let j = -1; j <= 1; j++) for (let i = -2; i <= 2; i++) { if (m.groundAt(p.x + i, p.y + j) === G_.DFLOOR && r() < .8) m.set(p.x + i, p.y + j, th === 'flesh' ? G_.BLOOD : G_.WATER); } } }
  }
  // старт
  const start = m.randomFree(); m.start = start;
  m.put(start.x, start.y - 1 >= 0 && m.groundAt(start.x, start.y - 1) === G_.DFLOOR ? start.y - 1 : start.y, { t: 'ladderUp', walk: true });
  const lu = m.objAt(start.x, start.y) || m.objAt(start.x, start.y - 1); if (lu) m.start = { x: lu.x, y: lu.y + 1 <= m.h - 2 && m.groundAt(lu.x, lu.y + 1) === G_.DFLOOR ? lu.y + 1 : lu.y };
  if (m.objAt(m.start.x, m.start.y)) m.start = start;
  // костёр
  if (n % 5 === 0) {
    const b = m.randomFree((x, y) => Math.abs(x - m.start.x) + Math.abs(y - m.start.y) < 6 && Math.abs(x - m.start.x) + Math.abs(y - m.start.y) > 1);
    if (b) { m.put(b.x, b.y, { t: 'bonfire', floor: n }); m.lights.push({ x: b.x * 16 + 8, y: b.y * 16 + 4, r: 70, col: 'fire' }); }
    if (n === 5) { const g2 = m.randomFree((x, y) => b && Math.abs(x - b.x) + Math.abs(y - b.y) <= 3 && Math.abs(x - b.x) + Math.abs(y - b.y) >= 2); if (g2) m.npcSpots = { grobus: g2 }; }
  }
  // камни
  const rockChance = .16 + Math.min(.08, n * .003);
  const ores = n <= 10 ? [[70, 'stone'], [12, 'copper'], [5, 'coal'], [4, 'geode'], [2, 'gem']] :
    n <= 20 ? [[62, 'stone'], [8, 'copper'], [12, 'iron'], [6, 'coal'], [5, 'geode'], [3, 'gem']] :
      [[55, 'stone'], [12, 'iron'], [10, 'gold'], [7, 'coal'], [6, 'geode'], [4, 'gem'], [1, 'mystic']];
  for (let y = 1; y < m.h - 1; y++) for (let x = 1; x < m.w - 1; x++) {
    if (m.groundAt(x, y) !== G_.DFLOOR || m.objAt(x, y)) continue;
    if (Math.abs(x - m.start.x) + Math.abs(y - m.start.y) < 3) continue;
    const v = r();
    if (v < rockChance) { const kind = U.wchoice(ores); m.put(x, y, { t: 'rock', kind, hp: { stone: 1, copper: 3, iron: 4, gold: 6, coal: 2, geode: 3, gem: 5, mystic: 10 }[kind] + Math.floor(n / 12), v: Math.floor(r() * 4), dt: th }); }
    else if (v < rockChance + .012) m.put(x, y, { t: 'crate', v: r() < .5 ? 1 : 0, hp: 2 });
  }
  // сундук с особой наградой
  const CHESTS = { 3: 'copper_sword', 7: 'shorts', 13: 'blood_scythe', 17: 'eatme', 23: 'moonsword', 27: 'drinkme', 50: 'void_sword' };
  if (CHESTS[n] && !(S.flags['chest' + n])) { const c = m.randomFree((x, y) => Math.abs(x - m.start.x) + Math.abs(y - m.start.y) > 8); if (c) m.put(c.x, c.y, { t: 'chest', dungeon: CHESTS[n], floor: n }); }
  // монстры
  const spawnKey = th === 'cellar' ? (n >= 5 ? 'cellar2' : 'cellar') : th;
  const cnt = 5 + Math.floor(n / 3) + U.ri(0, 4);
  m.infested = n > 3 && n % 10 !== 5 && r() < .12;
  for (let k = 0; k < (m.infested ? cnt * 2 : cnt); k++) {
    const p = m.randomFree((x, y) => Math.abs(x - m.start.x) + Math.abs(y - m.start.y) > 7); if (!p) continue;
    spawnMonster(m, U.wchoice(DUNGEON_SPAWNS[spawnKey]), p.x * 16 + 8, p.y * 16 + 12, n);
  }
  // пятно крови (души)
  if (S.blood && S.blood.floor === n) { const p = m.randomFree(); if (p) m.put(p.x, p.y, { t: 'bloodstain', walk: true }); }
  m.rocksLeft = m.objs.filter(o => o && o.t === 'rock').length;
  return m;
}
function buildBossFloor(m, n) {
  const W = m.w, H = m.h, cx = 17, cy = 11;
  m.dark = .5;
  m.fill(0, 0, W, H, G_.DWALL);
  m.ellipse(cx, cy, 9.5, 7.5, G_.DFLOOR);
  m.fill(16, 18, 3, 8, G_.DFLOOR);
  m.start = { x: 17, y: 24 };
  m.put(17, 25, { t: 'ladderUp', walk: true });
  m.boss = n === 10 ? 'kingslime' : n === 20 ? 'hatter' : 'author';
  const done = S.flags['boss' + n];
  if (n === 30) {
    m.dark = .45;
    // дверь Автора перед ареной
    if (!S.flags.authorDoorOpen && !S.flags.boss30) m.put(17, 18, { t: 'door', v: 1, author: true }); else m.put(17, 18, { t: 'crack' });
    m.put(16, 18, { t: 'bookstack' }); m.put(18, 18, { t: 'bookstack' });
    m.put(15, 22, { t: 'manuscript' });
    for (const [x, y] of [[11, 8], [23, 8], [11, 14], [23, 14]]) m.put(x, y, { t: 'bookstack' });
  } else if (!done) { for (let x = 16; x <= 18; x++) m.put(x, 19, { t: 'fog', walk: false }); }

    m.put(cx - 2, cy + 2, { t: 'bonfire', floor: n }); m.lights.push({ x: (cx - 2) * 16 + 8, y: (cy + 2) * 16 + 4, r: 70, col: 'fire' });
  } else if (n !== 30) m.bossPending = true;

}

/* ============================================================
   Мир: загрузка карт, переходы, рендер
   ============================================================ */
const World = {
  maps: {}, cur: null,
  init() {
    this.maps = {};
    this.maps.farm = buildFarm();
    this.maps.village = buildVillage();
    this.maps.forest = buildForest();
    Object.assign(this.maps, buildInteriors());
    if (S.mapState) this.restore(S.mapState);
    else this.firstSetup();
  },
  firstSetup() {
    const h = this.maps.house.objAt(1, 7);
    if (h) h.items = [{ id: 'blackseed', n: 1 }, { id: 'parsnip_seed', n: 5 }, { id: 'bottle', n: 1, of: 'grandpa' }];
    Spawner.dailyForage(true);
  },
  get(id) {
    if (id.startsWith('well:')) return buildFloor(parseInt(id.split(':')[1]));
    return this.maps[id];
  },
  // сохранение состояния карт (только то, что меняется)
  serialize() {
    const out = {};
    for (const id of ['farm', 'greenhouse', 'house', 'forest', 'village']) {
      const m = this.maps[id]; if (!m) continue;
      const objs = [], seen = new Set();
      for (const o of m.objs) if (o && !seen.has(o)) { seen.add(o); const c = Object.assign({}, o); objs.push(c); }
      const soil = [];
      if (m.soil) m.soil.forEach((s, k) => { if (s) soil.push([k % m.w, (k / m.w) | 0, s]); });
      const ground = [];
      if (id === 'forest') for (let x = 15; x <= 16; x++) ground.push(m.groundAt(x, 24));
      out[id] = { objs, soil, ground };
    }
    return out;
  },
  restore(st) {
    for (const id in st) {
      const m = this.maps[id]; if (!m) continue;
      m.objs.fill(null);
      for (const o of st[id].objs) { const c = Object.assign({}, o); delete c.w; delete c.h; m.put(o.x, o.y, Object.assign(c, { w: o.w, h: o.h })); }
      if (m.soil) { m.soil.fill(null); for (const [x, y, s] of st[id].soil || []) m.soil[y * m.w + x] = s; }
      if (id === 'forest' && S.flags.bridge) { m.fill(15, 24, 2, 1, G_.BRIDGE); }
      m.dirtyGround = true;
    }
  },
  enter(id, tx, ty, dir = 'down', silent = false) {
    const prev = this.cur;
    if (prev && prev.id.startsWith('well:') && !id.startsWith('well:')) Game.leftWell();
    const m = this.get(id);
    if (!m) { console.warn('no map', id); return; }
    UI.bossBar(null);
    this.cur = m;
    if (m.start && (tx === undefined || tx === null)) { tx = m.start.x; ty = m.start.y; }
    if (m.warps[tx + ',' + ty]) ty += dir === 'up' ? -1 : dir === 'down' ? 1 : 0;
    P.x = tx * 16 + 8; P.y = ty * 16 + 12; P.dir = dir; P.act = null; P.roll = 0; P.kbx = P.kby = 0;
    m.drops = m.drops || []; m.projs = []; m.parts = [];
    NPCRT.populate(m);
    if (id.startsWith('well:')) { const n = m.depth; if (n > S.wellMax) S.wellMax = n; Game.inWell(m); }
    Render.snapCamera();
    Music.play(Game.musicFor(m));
    if (!silent) UI.locName(m.name);
    Events.onEnter(m);
  },
  async warp(id, tx, ty, dir) {
    if (Game.warping) return; Game.warping = true;
    AU.sfx('door'); await UI.fade(true);
    this.enter(id, tx, ty, dir);
    await U.sleep(80); await UI.fade(false);
    Game.warping = false;
  },
};

/* ---------- рендер (прямо в разрешении экрана, мир масштабируется целым Z) ---------- */
const Render = {
  cv: null, ctx: null, light: null, lctx: null, Z: 3, VW: 0, VH: 0, camX: 0, camY: 0,
  shake: 0, flash: 0, flashCol: '#fff', frame: 0, t: 0, texts: [], _filter: '',
  init() {
    this.cv = $('#cv'); this.ctx = this.cv.getContext('2d');
    this.light = mkCanvas(10, 10); this.lctx = this.light.getContext('2d');
    this.resize(); addEventListener('resize', () => this.resize());
  },
  resize() {
    const r = this.cv.getBoundingClientRect(), dpr = Math.min(3, window.devicePixelRatio || 1);
    this.cv.width = Math.max(1, Math.round(r.width * dpr)); this.cv.height = Math.max(1, Math.round(r.height * dpr));
    const short = Math.min(this.cv.width, this.cv.height);
    const target = (Settings.zoom || 1) * (short < 700 ? 12.5 : 15);
    this.Z = Math.max(2, Math.round(short / (16 * target)));
    this.VW = this.cv.width / this.Z; this.VH = this.cv.height / this.Z;
    this.light.width = Math.ceil(this.VW / 2) + 2; this.light.height = Math.ceil(this.VH / 2) + 2;
    this.ctx.imageSmoothingEnabled = false;
    UI.layout();
  },
  snapCamera() { this.updateCamera(1); },
  updateCamera(k = 0.15) {
    const m = World.cur; if (!m) return;
    let tx = P.x - this.VW / 2, ty = P.y - 12 - this.VH / 2;
    const mw = m.w * 16, mh = m.h * 16;
    tx = mw <= this.VW ? (mw - this.VW) / 2 : U.clamp(tx, 0, mw - this.VW);
    ty = mh <= this.VH ? (mh - this.VH) / 2 : U.clamp(ty, 0, mh - this.VH);
    this.camX += (tx - this.camX) * k; this.camY += (ty - this.camY) * k;
    if (Math.abs(tx - this.camX) < .05) this.camX = tx; if (Math.abs(ty - this.camY) < .05) this.camY = ty;

  },
  apply(tool, level) {
    const m = World.cur; const f = frontTile();
    const tier = S.tools[tool] || 0;
    if (tool === 'hoe') {
      const tiles = this.tilesFor(level); let did = 0;
      for (const [x, y] of tiles) did += Farm.till(m, x, y) ? 1 : 0;
      useEnergy(toolCost('hoe') * Math.max(1, level + 1)); AU.sfx('hoe');

    }
    if (tool === 'can') {
      if (m.isWater(f.tx, f.ty) || (m.objAt(f.tx, f.ty) && m.objAt(f.tx, f.ty).t === 'well')) { S.water = [40, 55, 70, 85][tier]; AU.sfx('water'); UI.note('Лейка наполнена'); UI.toolbar(); return; }
      if (S.water <= 0) { UI.note('Лейка пуста. Набери воды у пруда.', 'bad'); AU.sfx('error'); return; }
      const tiles = this.tilesFor(level);
      for (const [x, y] of tiles) { if (S.water <= 0) break; const s = m.soilAt(x, y); if (s) { if (!s.water) { s.water = true; } S.water--; Parts.splash(x * 16 + 8, y * 16 + 9); } }
      useEnergy(toolCost('can') * Math.max(1, level + 1)); AU.sfx('water'); UI.toolbar(); return;

const Combat = {
  playerSwing(itemId) {
    const m = World.cur, it = ITEMS[itemId], w = it.w;
    const [fx, fy] = DIRV[P.dir]; const cx = P.x, cy = P.y - 10;
    let any = false;
    for (const mo of m.mons.slice()) {
      const mx = mo.x, my = mo.y - mo.h / 2 + mo.z * 0;
      const dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy);
      const reach = 24 + mo.w / 2;
      if (d > reach) continue;
      if (d > 8 && (dx * fx + dy * fy) / d < -.1) continue;
      if (mo.z > 14) continue;
      let dmg = U.rnd(w.min, w.max) * (1 + skillLvl('combat') * .03 + (S.lvl.str || 0) * .06) * buffMul('atk');
      const crit = Math.random() < (w.crit || .03); if (crit) dmg *= itemId === 'broken' ? 3.2 : 2.4;
      Mon.hit(m, mo, Math.round(dmg), crit, fx || dx / (d || 1), fy || dy / (d || 1)); any = true;
      if (w.leech) { S.hp = Math.min(S.maxHp, S.hp + dmg * w.leech); }
    }
    if (w.wave && S.energy > 0) { Proj.fire(m, P.x + fx * 8, P.y - 10 + fy * 8, fx * 170, fy * 170, 'wave', Math.round((w.min + w.max) / 2 * .6), 0, .6); }
    if (any) Render.shake = 2;
    // режем траву / ломаем ящики

};
